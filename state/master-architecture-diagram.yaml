kind: T_Collection
diagram:
  id: MASTER_ARCHITECTURE_DIAGRAM
  title: Cognitive Master Architecture Diagram
  version: 0.4.14
  canonical: true
  visual_generation_policy:
    yaml_updated_each_release: true
    internal_consistency_checked_each_release: true
    png_svg_pdf_generated_only_on_explicit_request: true
    generated_in_this_release: []
  nodes:
  - id: world
    label: External World
    kind: external
  - id: transformer_front
    label: Early Transformer Interpretation
    kind: subsystem
  - id: extraction
    label: Internal-Language Extraction Point
    kind: interface
  - id: internal_language
    label: Internal Language
    kind: interface
  - id: stm
    label: STM + D-Context
    kind: state
  - id: MSG2
    label: MSG2(amplitude, sequence_number, operation)
    kind: message
  - id: LTM1
    label: LTM1 Conservative Associative Graph
    kind: storage
  - id: LTM2
    label: LTM2 Episodes, Compositions, Scenarios
    kind: storage
  - id: selection
    label: Relevant Memory Selection
    kind: process
  - id: serialization
    label: Internal-Language Serialization
    kind: process
  - id: reinjection
    label: Memory Reinjection Point (Deeper)
    kind: interface
  - id: transformer_back
    label: Transformer Integration, Reasoning, and Response
    kind: subsystem
  - id: update
    label: New Internal State / UPDATE
    kind: process
  edges:
  - from: world
    to: transformer_front
    label: raw external message
  - from: transformer_front
    to: extraction
    label: external form translated
  - from: extraction
    to: internal_language
    label: selected intermediate representation
  - from: internal_language
    to: stm
    label: ordered internal state
  - from: stm
    to: MSG2
    label: 'later Dialogue: READ; all exchanges: UPDATE'
  - from: MSG2
    to: LTM1
    label: local operation interpretation
  - from: LTM1
    to: LTM2
    label: confirmed match and projection
  - from: LTM1
    to: selection
    label: active atoms and contexts
  - from: LTM2
    to: selection
    label: relevant episodes and scenarios
  - from: selection
    to: serialization
    label: bounded coherent content
  - from: serialization
    to: reinjection
    label: same internal language; bypass early translation
  - from: reinjection
    to: transformer_back
    label: semantic integration
  - from: transformer_back
    to: update
    label: new internal state
  - from: update
    to: stm
    label: create or extend D-Context
  invariants:
  - Raw external data never enters LTM1 or LTM2 as semantic input.
  - The first exchange of a new Dialogue is processed without READ.
  - The first UPDATE creates D-Context.
  - Later READ returns prior Dialogue content plus its relevant projection onto LTM1 and LTM2.
  - READ and UPDATE use one Transformer-derived internal language.
  - Every MSG2 propagates exclusively through persistent LTM1.
  - Waking operation does not structurally modify LTM1.
  - Only confirmed associative matches participate in LTM2 updates.
  - Memory selects and serializes relevant content; it does not generate a separate semantic language.
  - The Internal-Language Extraction Point and Memory Reinjection Point are distinct.
  - Serialized memory enters deeper than external input and bypasses early external-form interpretation.
  - A 20–30% later reinjection depth is a working hypothesis subject to experiment.
