- token: T_StagedTraining
  atomic: true
  definition: A progressive training strategy that first stabilizes the Transformer with a null Memory Vector and then integrates Associative Memory.
  status: T_Active
  index_target: ../chapter12/12_06.html
- token: T_NullMemoryVector
  atomic: true
  definition: The fixed all-zero canonical Memory Vector used while training the Transformer before Associative Memory is enabled.
  status: T_Active
  index_target: ../chapter12/12_06.html
- token: T_ForcedMemoryUtilization
  atomic: true
  definition: A training intervention used when the Transformer does not causally depend on the Memory Vector.
  status: T_Active
  index_target: ../chapter12/12_06.html
- token: T_AssociativeMemoryMaturity
  atomic: true
  definition: The representational stability required before Associative Memory is integrated with the Transformer.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_SemanticEquivalenceClass
  atomic: true
  definition: A set of differently serialized inputs that express the same meaning.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_SemanticInvariance
  atomic: true
  definition: The property that semantically equivalent inputs produce nearby canonical Memory Vectors.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_SemanticDiscrimination
  atomic: true
  definition: The property that semantically different inputs remain separated in canonical Memory Vector space.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_MultilingualConsistency
  atomic: true
  definition: Semantic invariance across equivalent messages expressed in different languages.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_IntraClassDistance
  atomic: true
  definition: Distance between Memory Vectors generated by inputs in the same semantic equivalence class.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_InterClassDistance
  atomic: true
  definition: Distance between Memory Vectors generated by inputs with different meanings.
  status: T_Active
  index_target: ../chapter12/12_07.html
- token: T_MemoryVector
  atomic: true
  definition: The canonical public interface produced by an explicit Associative Memory READ operation.
  status: T_Active
  index_target: ../chapter11/11_01.html
- token: T_MemoryVectorNormalization
  atomic: true
  definition: The staged canonicalization of Memory Vector through length normalization, post-stabilization orthogonalization, and sparse basis rotation.
  status: T_Active
  index_target: ../chapter11/11_06.html
- token: T_OrthogonalCoordinates
  atomic: true
  definition: A transformed coordinate system with negligible off-diagonal covariance for representative Memory Vectors.
  status: T_Active
  index_target: ../chapter11/11_04.html
- token: T_SparseBasisRotation
  atomic: true
  definition: A basis rotation intended to minimize the number of non-zero or significantly active coordinates for simple meanings.
  status: T_Active
  index_target: ../chapter11/11_05.html
- token: T_SequentialMemoryVectorNormalization
  atomic: true
  definition: 'A staged canonicalization process: length normalization first, statistical orthogonalization after semantic stabilization, and sparse basis rotation last.'
  status: T_Active
  index_target: ../chapter11/11_06.html
  label: Sequential Memory Vector Normalization
- token: T_LengthNormalizationStage
  atomic: true
  definition: The first canonicalization stage, which normalizes every non-zero raw Memory Vector by Euclidean length while retaining activation magnitude separately.
  status: T_Active
  index_target: ../chapter11/11_06.html
  label: Length Normalization Stage
- token: T_StatisticalOrthogonalizationStage
  atomic: true
  definition: The post-stabilization stage that estimates covariance and transforms Memory Vector coordinates toward negligible off-diagonal coupling.
  status: T_Active
  index_target: ../chapter11/11_06.html
  label: Statistical Orthogonalization Stage
- token: T_SparseRotationStage
  atomic: true
  definition: The final normalization stage that rotates an approximately orthogonal basis to reduce the number of materially active coordinates for simple meanings.
  status: T_Active
  index_target: ../chapter11/11_06.html
  label: Sparse Rotation Stage
- token: T_AssociativeMemoryImplementationCandidates
  atomic: true
  definition: Existing technical families that can supply parts of the Cognitive memory architecture.
  status: T_Active
  index_target: ../chapter10/10_06.html
  label: Associative Memory Implementation Candidates
- token: T_ImplementationGapAnalysis
  atomic: true
