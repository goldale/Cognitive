  status: T_Active
  index_target: ../chapter10/10_06.html
  label: Sparse Distributed Memory
- token: T_VectorCandidateRetrieval
  atomic: true
  definition: Approximate nearest-neighbour retrieval used to propose memory elements for subsequent associative activation.
  status: T_Active
  index_target: ../chapter10/10_06.html
  label: Vector Candidate Retrieval
- token: T_HybridAssociativeMemory
  atomic: true
