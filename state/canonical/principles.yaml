kind: T_Collection
principles:
- kind: T_Principle
  id: P_021
  title: Transformer-defined internal language
  statement: The internal language of the cognitive system is the representation exposed by a selected intermediate
    Transformer layer or a stable projection of that layer.
  status: T_Accepted
- kind: T_Principle
  id: P_022
  title: Transformer-specific memory
  statement: Associative Memory is initialized empty and develops as a long-term extension of the internal semantic
    space of its specific trained Transformer.
  status: T_Accepted
- kind: T_Principle
  id: P_023
  title: No raw external input to memory
  statement: LTM1, LTM2, and STM never receive raw external observations as semantic content; both READ and UPDATE
    operate only on internal-language representations produced by the Transformer interface layer.
  status: T_Accepted
- kind: T_Principle
  id: P_024
  title: Dialogue-aware cognitive cycle
  statement: A Dialogue is a logically connected exchange with the external world. The first exchange is processed
    without memory READ; its UPDATE creates dialogue context for subsequent memory participation.
  status: T_Accepted
- kind: T_Principle
  id: P_025
  title: Memory retrieval and serialization
  statement: Memory does not invent a separate serialized memory message language. READ selects relevant dialogue and long-term
    memory state and serializes that information in the internal language for Transformer processing.
  status: T_Accepted
- kind: T_Principle
  id: P_035
  title: READ and UPDATE as one cognitive cycle
  statement: READ supplies prior dialogue context and its projection onto long-term memory; UPDATE stores the new
    internal state produced after Transformer processing.
  status: T_Accepted
- kind: T_Principle
  id: P_026
  title: Per-element episode representation
  statement: Transformer output for a completed Logical Episode is a context-dependent vector for every participating
    element; each full vector is stored once in its episode-graph vertex.
  status: T_Accepted
- kind: T_Principle
  id: P_027
  title: Causal graph orientation
  statement: Direction in an episode graph expresses causality and is independent of physical connection orientation
    and current activation propagation.
  status: T_Accepted
- kind: T_Principle
  id: P_028
  title: Connection Trace Lists
  statement: Every physical LTM connection may hold multiple independently matchable traces, and associative retrieval
    evaluates those connection-local lists.
  status: T_Accepted
- kind: T_Principle
  id: P_029
  title: Virtual path contraction
  statement: Semantic search advances a temporary endpoint while retaining the origin; intermediate steps remain
    virtual and only the completed endpoint pair may trigger switch reconfiguration.
  status: T_Accepted
- kind: T_Principle
  id: P_030
  title: Semantic forgetting requires Transformer evaluation
  statement: Local trace statistics cannot determine semantic dispensability; retained graph structure must be reconstructed
    and evaluated by the Transformer before destructive forgetting.
  status: T_Accepted
- kind: T_Principle
  id: P_031
  title: Single physical LTM
  statement: Semantic and episodic processes operate through distinct message types and orthogonal state subspaces
    of one physical LTM vertex and connection array.
  status: T_Accepted
- kind: T_Principle
  id: P_032
  title: Temporal and causal episode representations
  statement: A completed linear STM Sequence determines the participating episode vertices, while the main Transformer
    determines the possibly branched causal graph topology.
  status: T_Accepted
- kind: T_Principle
  id: P_033
  title: Orthogonal message-specific state
  statement: Each LTM message type activates and updates only its corresponding orthogonal state subspace.
  status: T_Accepted
- kind: T_Principle
  id: P_034
  title: Concurrent associative waves
  statement: Associative waves for different message types may execute concurrently in the same physical LTM without
    cross-subspace interference.
  status: T_Accepted
