kind: T_Collection
schema_version: 0.3.35
terms:
- definition: The Transformer role that produces semantic representations suitable for Associative Memory learning.
  term: Semantic Teacher
- definition: Learning in which Transformer-produced semantic representations update Associative Memory.
  term: Semantic Feedback Learning
- definition: The first-class architectural process coordinating the closed self-learning loop.
  term: Semantic Feedback Learning Pipeline
- definition: The canonical semantic object accepted by UPDATE.
  term: Semantic Representation
- definition: The dynamic internal state of Associative Memory, including persistent and short-lived organization.
  term: Memory State
- definition: A transient retrieval representation produced exclusively by READ.
  term: Memory Vector
- definition: The Associative Memory operation that maps Memory State and Query to a Memory Vector without modifying Memory State.
  term: READ
- definition: The Associative Memory operation that incorporates a Semantic Representation into Memory State and returns no Memory Vector.
  term: UPDATE
- definition: The Associative Memory role that incorporates Transformer-produced Semantic Representations into Memory State through UPDATE.
  term: Semantic Learner
- definition: The Associative Memory role that produces a Memory Vector through explicit READ without modifying Memory State.
  term: Contextual Retriever
- definition: The future memory-lifecycle subsystem that estimates the context-sensitive significance of semantic knowledge and memory structures.
  term: Importance Estimation
- definition: Protected reorganization of Memory State outside the immediate online response path.
  term: Offline Consolidation
- definition: A future operating mode for offline consolidation, pruning, structural analysis, and other expensive memory maintenance.
  term: Sleep
- definition: Controlled reactivation of selected semantic experience through the Transformer and the canonical Semantic Feedback Learning Pipeline.
  term: Replay
- definition: Controlled reduction of accessibility, precision, or persistence for memory whose expected utility no longer justifies its cost or interference.
  term: Forgetting
- definition: Removal or compression of redundant, obsolete, low-confidence, or harmful memory structures under explicit policy.
  term: Memory Pruning
- definition: Modification of Associative Memory topology based on accumulated evidence rather than ordinary online weight updates.
  term: Structural Plasticity
- definition: A future conservative subsystem integrating goals, context, memory, consequences, and candidate actions into system-level evaluation.
  term: Global Evaluation
- definition: Learning between Cognitive systems through exchanged Semantic Representations and local controlled UPDATE.
  term: Multi-Agent Semantic Learning
