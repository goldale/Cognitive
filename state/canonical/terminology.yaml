kind: T_Collection
terms:
- definition: The Transformer role that produces semantic representations suitable for Associative Memory learning.
  term: Semantic Teacher
- definition: Learning in which Transformer-produced semantic representations update Associative Memory.
  term: Semantic Feedback Learning
- definition: The first-class architectural process coordinating the closed self-learning loop.
  term: Semantic Feedback Learning Pipeline
- definition: The canonical semantic object accepted by UPDATE.
  term: Semantic Representation
- definition: The dynamic internal state of Associative Memory, including persistent and short-lived organization.
  term: Memory State
- definition: The fixed-dimensional, opaque output produced by READ from the distributed MSG2 response of the current
    long-term-memory state to the latest Sequencer chain. Individual coordinates have no predefined semantics.
  term: Memory Vector
- definition: The non-mutating operation in which every node of the latest STM Sequencer chain emits MSG2(amplitude,
    sequence_number), MSG2 propagates exclusively through the persistent LTM1 associative graph, and a readout operator
    produces the Memory Vector.
  term: READ
- definition: The Associative Memory operation that incorporates a Semantic Representation into Memory State and
    returns no Memory Vector.
  term: UPDATE
- definition: The Associative Memory role that incorporates Transformer-produced Semantic Representations into Memory
    State through UPDATE.
  term: Semantic Learner
- definition: The Associative Memory role that produces a Memory Vector through explicit READ without modifying
    Memory State.
  term: Contextual Retriever
- definition: The future memory-lifecycle subsystem that estimates the context-sensitive significance of semantic
    knowledge and memory structures.
  term: Importance Estimation
- definition: Protected reorganization of Memory State outside the immediate online response path.
  term: Offline Consolidation
- definition: A future operating mode for offline consolidation, pruning, structural analysis, and other expensive
    memory maintenance.
  term: Sleep
- definition: Controlled reactivation of selected semantic experience through the Transformer and the canonical
    Semantic Feedback Learning Pipeline.
  term: Replay
- definition: Controlled reduction of accessibility, precision, or persistence for memory whose expected utility
    no longer justifies its cost or interference.
  term: Forgetting
- definition: Removal or compression of redundant, obsolete, low-confidence, or harmful memory structures under
    explicit policy.
  term: Memory Pruning
- definition: Modification of Associative Memory topology based on accumulated evidence rather than ordinary online
    weight updates.
  term: Structural Plasticity
- definition: A future conservative subsystem integrating goals, context, memory, consequences, and candidate actions
    into system-level evaluation.
  term: Global Evaluation
- definition: Learning between Cognitive systems through exchanged Semantic Representations and local controlled
    UPDATE.
  term: Multi-Agent Semantic Learning
- definition: A modality-neutral linear or circular field of fixed-dimensional input elements written sequentially
    before activation enters STM.
  term: Input Buffer
- definition: One fixed-dimensional modality-neutral physical element of the Input Buffer, permanently connected
    to one corresponding STM node.
  term: Input Buffer Element
- definition: The service coordinate reserved within an activation vector to preserve source or transmission mode
    without encoding Item identity.
  term: Transmission Context
- definition: A typed non-normative documentation object that preserves a deferred alternative or side observation
    outside the canonical architecture.
  term: Margin Note
- term: Trace List
  definition: A list of independently matchable local trace structures stored on one physical LTM connection and
    used as the associative-search domain at that connection.
- term: Minimal Semantic Search Trace
  definition: A connection-local associative discriminator whose placement identifies a possible transition and
    whose value determines compatibility with the current activation.
- term: Progressive Virtual Contraction
  definition: A semantic-search process in which the origin remains fixed while each successful transition replaces
    the temporary virtual endpoint, without intermediate switch-fabric reconfiguration.
- term: Episode Graph Vertex
  definition: The unique storage location for the complete Transformer-produced vector of one element in one completed
    Logical Episode.
- term: Sequencer
  definition: The Input / STM component that orders and normalizes the combined buffered stream, proposes Logical
    Episode boundaries, and delegates uncertain boundary cases to the main Transformer.
- term: Long-Term Memory
  definition: The single physical persistent associative memory implemented by one shared vertex and connection
    array.
- term: LTM1
  definition: The semantic logical domain of the single physical LTM, accessed through MSG1 and its orthogonal message-specific
    state subspace.
- term: LTM2
  definition: The episodic MSG2-specific logical domain of the single physical LTM. LTM2 has no independent propagation
    graph; MSG2 uses the persistent LTM1 associative graph as its computational substrate.
- term: MSG1
  definition: The element-LTM1 message type operating exclusively in the MSG1 orthogonal state subspace.
- term: MSG2
  definition: The STM-emitted LTM message MSG2(amplitude, sequence_number, operation). Its operation field initially
    supports READ and UPDATE. Every MSG2 excites LTM1 and propagates only through the persistent LTM1 graph; UPDATE
    participation in LTM2 is permitted only after a confirmed associative match.
- term: Orthogonal Message-Specific State Subspace
  definition: The portion of LTM vertex and connection state activated and updated exclusively by one message type.
- term: Associative Retrieval Wave
  definition: A repeated local match-and-transition process confined to one message-specific state subspace.
- term: Sequence
  definition: A directed linear STM activation chain. External input chains are produced by the Sequencer; UPDATE
    chains are constructed directly by Transformer with already defined starts, ends, order, and structural links.
- term: Memory Vector Readout
  definition: The fixed dimensionality-reduction stage that maps the distributed MSG2 response to Memory Vector
    cells using an experimentally selected operator.
- term: Readout Entropy
  definition: The entropy of Memory Vectors over a representative distribution of LTM states and Event Queries;
    for deterministic READ it is the primary information-density metric for comparing readout operators.
- term: MSG2 Operation
  definition: The per-message local instruction carried by MSG2. Initial values are READ and UPDATE; the operation
    is interpreted by the receiving LTM1 node.
- term: Native LTM1 Language
  definition: The system-internal vocabulary of associative atoms exported from selected LTM1 activity to Transformer
    through controlled excitation and a sequence of Memory Vector readouts.
- term: Associative Match
  definition: The local confirmation that an LTM1 candidate is compatible with the object and its context; only
    confirmed matches may participate in an LTM2 update.
- term: Context
  definition: One or two existing LTM1 links used to constrain and disambiguate the associative match of an object.
- term: Contextual Four-Tuple
  definition: The working UPDATE unit consisting of object, context, previous, and next; previous and next are realized
    by the STM chain structure.
