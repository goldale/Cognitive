kind: T_Collection
invariants:
- id: INV_001
  statement: READ does not structurally modify LTM1 or LTM2 during normal waking operation.
  severity: release_blocking
- id: INV_002
  statement: UPDATE may change dialogue state and LTM2 content but does not structurally modify LTM1 during waking
    operation.
  severity: release_blocking
- id: INV_003
  statement: Memory output is a serialized internal-language sequence, not a separately generated memory language.
  severity: release_blocking
- id: INV_004
  statement: The first exchange of a new Dialogue performs no memory READ.
  severity: release_blocking
- id: INV_005
  statement: The first UPDATE of a Dialogue creates the initial dialogue context available to later READ operations.
  severity: release_blocking
- id: INV_006
  statement: Raw external observations are never semantic inputs to STM, LTM1, or LTM2.
  severity: release_blocking
- id: INV_007
  statement: Both READ and UPDATE inputs are representations from the selected Transformer internal-language interface.
  severity: release_blocking
- id: INV_008
  statement: Input Buffer elements are filled sequentially without semantic routing or destination lookup.
  severity: release_blocking
- id: INV_009
  statement: Every Input Buffer element has exactly one permanent physical projection to one corresponding STM node.
  severity: release_blocking
- id: INV_010
  statement: Input Buffer element count equals STM node count, and their per-element runtime vector dimensionality
    is equal.
  severity: release_blocking
- id: INV_011
  statement: One coordinate of the fixed-dimensional input activation vector is reserved for transmission context
    and does not encode Item identity.
  severity: release_blocking
- id: INV_012
  statement: Stage-1 temporal order is derived from sequential Input Buffer insertion; parallel completion order
    must not redefine observation order.
  severity: release_blocking
- id: INV_013
  statement: The Sequencer assigns a position number to every node of the linear STM Sequence.
  severity: release_blocking
- id: INV_014
  statement: Every active STM node emits MSG2(amplitude, sequence_number, operation); STM-node activation is the
    only MSG2 emission mechanism.
  severity: release_blocking
- id: INV_015
  statement: Every MSG2, whether READ or UPDATE, propagates exclusively through the persistent associative graph
    stored in LTM1.
  severity: release_blocking
- id: INV_016
  statement: READ never creates temporary associative connections.
  severity: release_blocking
- id: INV_017
  statement: LTM2 has no independent propagation graph or propagation logic.
  severity: release_blocking
- id: INV_020
  statement: The MSG2 operation field is interpreted locally by each receiving LTM1 node; no global STM READ or
    UPDATE mode is required.
  severity: release_blocking
- id: INV_021
  statement: READ and UPDATE messages may be emitted concurrently by different nodes of one STM structure.
  severity: release_blocking
- id: INV_022
  statement: An UPDATE operation designates an associative-match request, not an immediate LTM2 write.
  severity: release_blocking
- id: INV_023
  statement: Only a confirmed associative match may mark an LTM1 atom as participating in an LTM2 update.
  severity: release_blocking
- id: INV_024
  statement: UPDATE excitation propagates through the same persistent LTM1 graph as READ excitation.
  severity: release_blocking
- id: INV_025
  statement: During UPDATE, the Sequencer is not invoked because Transformer directly constructs STM chains with
    fully defined starts, ends, order, and structural links.
  severity: release_blocking
- id: INV_026
  statement: Transformer and memory communicate in one shared internal language defined by the selected intermediate
    Transformer representation.
  severity: release_blocking
- id: INV_027
  statement: READ serializes only relevant memory information; it does not serialize the complete LTM1 or LTM2 state.
  severity: release_blocking
- id: INV_028
  statement: For an active Dialogue, READ returns previous dialogue content together with its relevant projection
    onto LTM1 and LTM2.
  severity: release_blocking
- id: INV_029
  statement: UPDATE carries a new internal state produced during Transformer processing and extends the current
    Dialogue context.
  severity: release_blocking
- id: INV_030
  statement: Structural changes to conservative LTM1 are permitted only during Sleep or Offline Consolidation.
  severity: release_blocking
- id: INV_031
  statement: STM transports and orders internal-language messages but does not define their semantics.
  severity: release_blocking
- kind: T_Invariant
  id: INV_INTERNAL_INTERFACE_ASYMMETRY
  statement: The Internal-Language Extraction Point and Memory Reinjection Point are distinct interfaces.
- kind: T_Invariant
  id: INV_MEMORY_BYPASSES_EARLY_TRANSLATION
  statement: Serialized memory bypasses early Transformer layers whose function is translation of raw external form.
- kind: T_Invariant
  id: INV_REINJECTION_OFFSET_EXPERIMENTAL
  statement: The extraction-to-reinjection depth offset is implementation-dependent; 20–30% later depth is a working
    hypothesis, not a fixed invariant.
