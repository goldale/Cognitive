kind: T_Collection
operations:
- id: OP_READ
  effects: []
  forbidden_outputs:
  - Updated Memory State
  inputs:
  - Current LTM State
  - Latest STM Sequencer Chain
  - Operation Mode = READ
  name: READ
  outputs:
  - Memory Vector
  owner: Associative Memory
  stages:
  - Reset Memory Vector output cells
  - Assign or preserve Sequencer position numbers
  - Emit MSG2(amplitude, sequence_number) from every active Sequence node
  - Inject MSG2 through permanent STM-to-LTM projections
  - Propagate MSG2 exclusively through the persistent LTM1 associative graph
  - Reduce the distributed response with MAX or SUM readout
  - Return Memory Vector
  - Clear transient MSG2 state
  candidate_readout_operators:
  - MAX
  - SUM
  selection_metric: For deterministic READ, maximize non-degenerate Memory Vector entropy over representative states
    and events. For stochastic READ, maximize mutual information rather than raw entropy.
- id: OP_UPDATE
  effects:
  - modifies Memory State
  forbidden_outputs:
  - Memory Vector
  implicit_operations_forbidden:
  - READ
  inputs:
  - Memory State
  - Semantic Representation
  name: UPDATE
  outputs:
  - Updated Memory State
  owner: Associative Memory
pipeline:
  id: PROC_SFL
  name: Semantic Feedback Learning Pipeline
  stages:
  - External Input
  - Associative Memory READ
  - Memory Vector
  - Transformer semantic reasoning
  - Transformer semantic teaching
  - Semantic Representation
  - Associative Memory UPDATE
  - Updated Memory State
