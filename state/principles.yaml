kind: T_Collection
schema_version: 0.1.0
principles:
- kind: T_Principle
  id: P_001
  title: Architecture over component complexity
  statement: Prefer improved organization of existing components over increasing the complexity of individual components.
  status: T_Accepted
- kind: T_Principle
  id: P_002
  title: Evolution over replacement
  statement: Construct independently useful stages that create evidence and infrastructure for deeper integration.
  status: T_Accepted
- kind: T_Principle
  id: P_003
  title: Best next step
  statement: Choose the next architectural change by practical utility, engineering cost, risk, and the number of future options it opens.
  status: T_Accepted
- kind: T_Principle
  id: P_004
  title: Biological evidence
  statement: Treat durable biological solutions as strong architectural candidates, not as proof of engineering optimality.
  status: T_Accepted
- kind: T_Principle
  id: P_005
  title: State and computation separation
  statement: Keep persistent user or research state independent from replaceable computational models.
  status: T_Accepted
- kind: T_Principle
  id: P_006
  title: Token semantic stability
  statement: Never redefine the semantic identity of a Token; introduce a new Token when the meaning changes.
  status: T_Accepted
- kind: T_Principle
  id: P_007
  title: Atomic reduction
  statement: Judge language maturation partly by reduction of the Atomic Token set without loss of expressive power.
  status: T_Accepted
- kind: T_Principle
  id: P_008
  title: Single history mechanism
  statement: Use Git as the only version-history mechanism; do not reproduce repository history inside Research State.
  status: T_Accepted
- kind: T_Principle
  id: P_009
  title: Semantic transition record
  statement: Store only the latest semantic consolidation record in each version of Research State; Git distributes prior records across commits.
  status: T_Accepted
- kind: T_Principle
  id: P_010
  title: Canonical project language
  statement: Write all project artifacts in English while permitting design dialogue in any language.
  status: T_Accepted
- kind: T_Principle
  id: P_011
  title: Architectural primacy
  statement: Engineer fundamental computational mechanisms before directly engineering higher-level behavior.
  status: T_Accepted
- kind: T_Principle
  id: P_012
  title: Communication decomposition
  statement: Model communication as partial serialization, deserialization, and integration into the recipient's own model.
  status: T_Accepted
- kind: T_Principle
  id: P_013
  title: Generated documentation
  statement: Treat human-readable documents as partial serializations generated from canonical Research State.
  status: T_Accepted
- kind: T_Principle
  id: P_014
  title: Delayed deep integration
  statement: Use current components in a working system before attempting a tighter integrated representation.
  status: T_Accepted
- kind: T_Principle
  id: P_015
  title: State recovery
  statement: Research State and generated documentation must permit work to resume after context loss with minimal reconstruction.
  status: T_Accepted
