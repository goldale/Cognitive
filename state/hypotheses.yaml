kind: T_Collection
schema_version: 0.3.36
hypotheses:
- kind: T_Hypothesis
  id: H_001
  statement: Long-term cognitive capability depends more on knowledge organization than on isolated inference power.
  status: T_Working
  confidence: 0.82
  evidence:
  - A system with stable inference but improved memory organization should improve on longitudinal tasks.
  falsifiers:
  - Longitudinal capability scales only with inference-model capability after controlling for memory organization.
- kind: T_Hypothesis
  id: H_002
  statement: No finite universal world model exists; world models are optimized for objective-limited classes of cognitive systems.
  status: T_Working
  confidence: 0.9
  evidence:
  - Predator, herbivore, scientist, and artist models preserve different distinctions in the same environment.
  falsifiers:
  - One finite representation is shown to dominate all alternatives across every objective class.
- kind: T_Hypothesis
  id: H_003
  statement: Biological long-term memory is functionally lossy because integration and future utility are optimized over archival fidelity.
  status: T_Working
  confidence: 0.78
  evidence:
  - Reconstructive recall and systematic loss coexist with effective action.
  falsifiers:
  - Loss is fully explained by storage limits and provides no functional advantage.
- kind: T_Hypothesis
  id: H_004
  statement: Most new experience first changes importance, utility, confidence, and activation weights before changing architecture.
  status: T_Working
  confidence: 0.85
  evidence:
  - Local reweighting is cheaper and more frequent than structural reorganization.
  falsifiers:
  - Each significant experience deterministically rewrites architecture.
- kind: T_Hypothesis
  id: H_005
  statement: Large architectural consolidation is an iterative search process, not a deterministic transformation from changed weights.
  status: T_Working
  confidence: 0.88
  evidence:
  - The optimal reorganization cannot be known before candidate evaluation.
  falsifiers:
  - A general closed-form optimal restructuring function is demonstrated.
- kind: T_Hypothesis
  id: H_006
  statement: A trainable integrated multichannel evaluation mechanism is a prerequisite for a persistent functional Self.
  status: T_Working
  confidence: 0.72
  evidence:
  - Cross-domain decisions require comparison on a common learned scale.
  falsifiers:
  - Stable self-continuity and goal selection emerge without any integrated evaluation mechanism.
- kind: T_Hypothesis
  id: H_007
  statement: Social, psychological, ethical, political, and emotional phenomena can emerge from mature cognitive architecture rather than separate hard-coded subsystems.
  status: T_Working
  confidence: 0.62
  evidence:
  - Higher-level behavior in biological systems emerges from interacting lower-level mechanisms.
  falsifiers:
  - A target phenomenon requires an irreducible independent module in every viable architecture.
- kind: T_Hypothesis
  id: H_008
  statement: For strongly integrated distributed memories, dialogue is the maximum generally viable form of experience transfer; direct Merge is not well-defined.
  status: T_Working
  confidence: 0.86
  evidence:
  - An experience derives meaning from system-wide context that cannot be inserted locally into another model.
  falsifiers:
  - Arbitrary mature cognitive states can be merged without destructive interference or identity loss.
- kind: T_Hypothesis
  id: H_009
  statement: A significant book or lecture changes the integrated evaluation system and therefore future attention, questions, and learning direction.
  status: T_Working
  confidence: 0.84
  evidence:
  - Readers retain changed judgments after explicit details are forgotten.
  falsifiers:
  - All durable effects are explainable as retrieval of stored propositions alone.
- kind: T_Hypothesis
  id: H_010
  statement: A trainable meta-architect can improve practical task decomposition between neural and algorithmic computation using current technology.
  status: T_Working
  confidence: 0.91
  evidence:
  - Task descriptors and observed utility provide a direct supervised or bandit learning signal.
  falsifiers:
  - No stable task features predict executor performance better than random allocation.
- kind: T_Hypothesis
  id: H_011
  statement: A small set of diverse cognitive lineages with champion cloning inside each lineage balances commercial efficiency and population resilience.
  status: T_Working
  confidence: 0.8
  evidence:
  - Colony-like biological strategies combine specialization and diversity.
  falsifiers:
  - A single globally cloned champion remains robust under broad unforeseen environmental changes.
- kind: T_Hypothesis
  id: H_012
  statement: A holographic-style representation transformation may make memory, world model, and some higher-level forces different projections of one integrated state.
  status: T_Working
  confidence: 0.55
  evidence:
  - One representation could remove explicit subsystems by making their behavior emergent.
  falsifiers:
  - Every candidate integrated representation performs worse than explicit modular decomposition.
- kind: T_Hypothesis
  id: H_013
  statement: Shared cognitive background contains more information than the new serialized message by definition and is the main source of communication compression.
  status: T_Working
  confidence: 0.96
  evidence:
  - Experts communicate complex structures through very short signals.
  falsifiers:
  - Message size alone predicts communicated meaning independently of shared background.
- kind: T_Hypothesis
  id: H_014
  statement: What is commonly called a universal human world model is largely the objective-driven model of a scientist.
  status: T_Working
  confidence: 0.75
  evidence:
  - Scientific cognition optimizes prediction, explanation, reproducibility, and consistency.
  falsifiers:
  - The scientific model is optimal for all biological, artistic, social, and engineering objectives.
- kind: T_Hypothesis
  id: H_015
  statement: An efficient internal cognitive language will probably differ substantially from natural English and may use dense context-dependent symbols.
  status: T_Working
  confidence: 0.67
  evidence:
  - Natural language is optimized for communication among non-identical humans, not internal integrated storage.
  falsifiers:
  - Natural English remains optimal for integrated memory, computation, and communication across mature systems.
