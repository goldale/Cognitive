kind: T_Collection
architectures:
- kind: T_ArchitectureDecision
  id: A_001
  title: Research State development loop
  status: T_Implemented
  summary: Discussion produces reviewed semantic changes to canonical T_ResearchState, from which documentation
    is generated.
  relations:
  - Discussion -> T_ChangeProposal
  - T_ChangeProposal -> T_ConsolidationRecord
  - T_ConsolidationRecord -> T_ResearchState
  - T_ResearchState -> T_Document
- kind: T_ArchitectureDecision
  id: A_002
  title: Memory and consolidation pipeline
  status: T_Implemented
  summary: T_WorkingMemory receives experience; T_LongTermMemory retains functionally useful state; T_Consolidation
    performs lossy compression and iterative architectural search.
  relations:
  - T_Experience -> T_WorkingMemory
  - T_WorkingMemory -> T_Consolidation
  - T_Consolidation -> T_LongTermMemory
  - T_LongTermMemory -> T_WorldModel
- kind: T_ArchitectureDecision
  id: A_003
  title: Communication pipeline
  status: T_Implemented
  summary: Communication is decomposed into T_PartialSerialization, T_Deserialization, T_ModelIntegration, clarification,
    and T_ModelConflictResolution.
  relations:
  - T_WorldModel -> T_PartialSerialization
  - T_PartialSerialization -> T_Channel
  - T_Channel -> T_Deserialization
  - T_Deserialization -> T_ModelIntegration
- kind: T_ArchitectureDecision
  id: A_004
  title: Integrated evaluation and functional Self
  status: T_Implemented
  summary: A trainable Integrated Evaluation function compares heterogeneous channels relative to goals, memory,
    and context and contributes to action selection.
  relations:
  - T_Observation -> T_GlobalEvaluation
  - T_GlobalEvaluation -> T_ObjectiveFunction
  - T_ObjectiveFunction -> T_Action
- kind: T_ArchitectureDecision
  id: A_005
  title: Hybrid computation meta-architecture
  status: T_Implemented
  summary: T_MetaArchitect allocates task operations among T_Algorithm, T_NeuralNetwork, and hybrid pipelines and
    learns from observed utility.
  relations:
  - T_Question -> T_MetaArchitect
  - T_MetaArchitect -> T_ArchitectureDecision
  - T_ArchitectureDecision -> T_Algorithm
  - T_ArchitectureDecision -> T_NeuralNetwork
- kind: T_ArchitectureDecision
  id: A_006
  title: Cognitive lineage population
  status: T_Implemented
  summary: Maintain multiple diverse T_CognitiveLineage classes while cloning high-performing systems within each
    lineage.
  relations:
  - T_CognitiveLineage -> T_CognitiveSystem
  - T_Evaluation -> T_CognitiveLineage
  - T_Communication -> T_CognitiveLineage
- kind: T_ArchitectureDecision
  id: A_007
  title: Transformer-specific internal-language memory interface
  status: T_Accepted
  summary: Associative Memory is initialized empty and learns exclusively from the selected internal representation
    of its trained Transformer. Memory output is serialized in that same language.
  relations:
  - Transformer Intermediate Representation -> STM
  - STM -> LTM1
  - LTM1 and LTM2 -> Serialized Memory Message
  - Serialized Memory Message -> Transformer
- kind: T_ArchitectureDecision
  id: A_008
  title: Stable internal-language interface representation
  status: T_Accepted
  summary: The memory interface uses a selected intermediate Transformer representation or a stable projection of
    it. Layer choice and normalization are implementation-dependent and require empirical justification.
  relations: []
- kind: T_ArchitectureDecision
  id: A_009
  title: Three-dimensional cognitive stream model
  status: T_Accepted
  summary: Preprocessing strategy is selected from Data Rate, Task Relevance, and Semantic Novelty relative to current
    Memory State.
  relations: []
- kind: T_ArchitectureDecision
  id: A_010
  title: Transformer as internal-language source
  status: T_Accepted
  summary: The trained Transformer defines the internal language used by Transformer, STM, LTM1, and LTM2.
  relations: []
- kind: T_ArchitectureDecision
  id: A_011
  title: Dialogue-aware cognitive memory cycle
  status: T_Accepted
  summary: The first Dialogue exchange is processed without READ; its UPDATE creates D-Context. Later cycles
    use READ, Transformer processing, and UPDATE.
  relations: []
- kind: T_ArchitectureDecision
  id: A_012
  title: READ and UPDATE in one shared language
  status: T_Accepted
  summary: READ and UPDATE are locally interpreted LTM1 operations operating in the same Transformer-defined internal
    representation space. READ retrieves and serializes relevant memory; UPDATE extends memory and Dialogue context.
  relations: []
- kind: T_ArchitectureDecision
  id: A_013
  title: Transformer-mediated internal-language input path
  status: T_Accepted
  summary: External and internal sources are interpreted by Transformer before semantic content enters STM. STM
    receives ordered internal-language representations rather than raw external observations.
  relations:
  - External Sources -> Transformer
  - Transformer Intermediate Representation -> STM
  - STM -> LTM1
- kind: T_ArchitectureDecision
  id: A_014
  title: Dialogue-aware READ and UPDATE through LTM1
  status: T_Accepted
  summary: The first exchange of a Dialogue performs no READ. Its UPDATE creates D-Context. Subsequent READ
    and UPDATE messages use the same persistent LTM1 propagation graph and the same Transformer-defined internal
    language.
  relations:
  - Transformer Internal Language -> STM Node
  - STM Node -> MSG2
  - MSG2 -> LTM1 Associative Graph
  - Relevant Dialogue Projection -> Serialized Memory Message
  - Confirmed Associative Match -> LTM2 Update
- kind: T_ArchitectureDecision
  id: A_015
  title: Memory retrieval and serialization in internal language
  status: T_Accepted
  summary: Memory does not create a native LTM1 language or generate an aggregated serialized memory message. It selects relevant
    D-Context and long-term-memory projections and serializes them in the internal language defined by the
    trained Transformer.
  relations:
  - D-Context -> Relevant Memory Selection
  - LTM1 and LTM2 -> Dialogue Projection
  - Relevant Memory Selection -> Serialized Memory Message
  - Serialized Memory Message -> Transformer
  text: The serialization procedure determines relevance, ordering, context, and termination. The semantic representation
    space is inherited from the selected Transformer intermediate layer or its stable projection.
- kind: T_ArchitectureDecision
  id: A_016
  title: Asymmetric internal-language extraction and memory reinjection
  status: T_Accepted
  summary: External input is translated into the internal language at an intermediate Transformer extraction
    point. Serialized memory is already in that language and is reinjected deeper into integration and reasoning
    layers, bypassing early external-form interpretation.
  relations:
  - External Input -> Early Transformer Interpretation
  - Early Transformer Interpretation -> Internal-Language Extraction Point
  - Serialized Memory Message -> Memory Reinjection Point
  - Memory Reinjection Point -> Transformer Cognitive Core (Deep Layers)
  text: A 20–30% later reinjection depth is a working experimental hypothesis, not a universal architectural constant.
