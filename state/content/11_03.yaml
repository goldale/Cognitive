blocks:
- text: A mature Memory State should map semantically equivalent inputs to nearby Memory Vectors even when wording or language differs. This is a test of invariance to surface serialization, not proof of complete semantic understanding.
  type: paragraph
- text: Stability should be measured over equivalence classes, paraphrases, translations, and context-preserving reformulations.
  type: paragraph
