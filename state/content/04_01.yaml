blocks:
- text: Biological memory does not behave as a precise archive. Recall is selective, reconstructive, context-dependent, and vulnerable to systematic distortion. The project generalizes this observation from human memory to biological memory in organisms with developed nervous systems, while acknowledging that direct measurement becomes increasingly difficult outside humans.
  type: paragraph
- title: Functional lossiness
  confidence: 0.78
  text: Memory loss and reconstruction are partly selected because they improve integration and future action, not only because biological storage is limited.
  type: hypothesis
- text: The relevant evolutionary objective is not historical fidelity. It is successful behavior under resource constraints. A memory architecture that preserves fewer literal details but produces a more usable model can outperform an exact archive.
  type: paragraph
section_id: S_04_01
