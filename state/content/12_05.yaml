id: S_12_05
blocks:
- text: A practical prototype can implement consolidation around an unchanged language model. Recent events enter working memory; a scheduled process extracts entities, adjusts confidence and utility, builds clusters, identifies conflicts, and writes a compact long-term state.
  type: paragraph
- text: The prototype in this repository implements working memory, long-term memory, functional forgetting, and iterative selection among flat, clustered, and hybrid organizations.
  type: paragraph
- text: The prototype is not evidence that these three organizations are sufficient. Its purpose is to make the architectural loop executable and measurable.
  type: paragraph
- title: Operational evidence first
  text: Use the modular prototype to collect failure cases before attempting a deeply integrated memory-model representation.
  type: principle
section_id: S_05_06
