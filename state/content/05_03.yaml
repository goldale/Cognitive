blocks:
- text: The same document can substantially change a novice world model and add almost nothing to an expert world model. Semantic Novelty is therefore a property of the pair consisting of input and current Memory State.
  type: paragraph
- text: Repeated information can remain relevant while becoming non-novel. Conversely, unfamiliar information can be novel while remaining irrelevant to the active objective.
  type: paragraph
