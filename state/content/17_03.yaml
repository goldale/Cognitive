blocks:
- text: YAML is used as a readable serialization of the formal state. Its flexibility is restricted by schema and profile rules.
  type: paragraph
- items:
  - Mappings with string keys
  - Sequences
  - Strings, booleans, finite numbers, and null
  - No anchors or aliases
  - No merge keys or custom tags
  - No duplicate keys
  - No implicit date or time values
  ordered: false
  type: list
- text: Canonical formatting produces stable field order and entity order while preserving semantically ordered block sequences.
  type: paragraph
- text: The format remains parseable by standard YAML tools and is validated against JSON Schema plus project-specific semantic rules.
  type: paragraph
section_id: S_11_03
