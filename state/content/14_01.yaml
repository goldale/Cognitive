blocks:
- text: Neural networks and classical programs both seek states that optimize a task-dependent functional, but they
    operate under different knowledge conditions.
  type: paragraph
- headers:
  - Class
  - Functional
  - Typical executor
  rows:
  - - I
    - Well defined and tractable
    - Algorithm, solver, finite-state machine
  - - II
    - Not explicit; examples are evaluated
    - Neural network
  - - III
    - Partly defined and partly example-based, or fully defined but very complicated.
    - Hybrid architecture
  type: table
- text: The third class includes many practical robotics, autonomous driving, diagnosis, planning, and dialogue
    tasks. The central engineering problem is where to cut the computation.
  type: paragraph
