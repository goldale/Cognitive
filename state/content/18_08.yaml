id: S_18_08
blocks:
- level: 3
  text: Scale Parameters
  type: heading
- text: Semantic query and response representations may reach 1024 x 1024 x 8 elements, or 8,388,608 elements per
    tensor. The value 8 denotes semantic channels and must not be interpreted as processing depth. Processing depth
    is intentionally small; the current working hypothesis is 4–8 layers, and every additional layer must demonstrate
    measurable improvement.
  type: paragraph
- text: Biological subsystem scale provides a first estimate of the relative number of processing nodes required
    by each specialized topology. These estimates must be translated through connectivity topology and hardware
    behavior rather than copied as one artificial node per biological neuron.
  type: paragraph
- headers:
  - Representation
  - Elements
  - INT4
  - INT8
  - INT16
  rows:
  - - One 1024 x 1024 x 8 tensor
    - 8,388,608
    - 4 MiB
    - 8 MiB
    - 16 MiB
  - - Input plus output
    - 16,777,216
    - 8 MiB
    - 16 MiB
    - 32 MiB
  type: table
- level: 3
  text: Processing Depth
  type: heading
- text: The architecture does not prescribe a fixed processing depth. The current working hypothesis is 4–8 layers.
    The exact depth must be determined experimentally, and every additional layer must demonstrate measurable improvement
    in associative stability, retrieval quality, or computational efficiency.
  type: paragraph
- text: A physical implementation may use pipelining, temporal reuse, tiling, wavelength multiplexing, spatial multiplexing,
    polarization, or modal channels. These are implementation strategies for a dense logical architecture.
  type: paragraph
- level: 3
  text: Dense Topology and Basis Compaction
  type: heading
- text: The implementation does not depend on sparse candidate routing as its primary model. Sequential localized
    orthogonalization removes semantic redundancy, transfers correlated magnitude into retained coordinates, and
    progressively compacts useful information.
  type: paragraph
- title: Dense hardware invariant
  text: Temporary inactive coordinates may reduce activity and power, but all released coordinates remain addressable
    until validated dimensional reduction is performed in a later release.
  type: principle
section_id: S_18_08
