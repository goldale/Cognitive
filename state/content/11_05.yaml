blocks:
- text: After decorrelation, a further rotation may seek sparse typical representations in which simple
    concepts activate relatively few coordinates. Statistical independence and semantic interpretability
    are separate objectives and must not be conflated.
  type: paragraph
- text: Representation Optimization changes the coordinate system, not the accumulated knowledge or memory
    graph topology. It is therefore distinct from UPDATE and from sleep-like structural reorganization.
  type: paragraph
