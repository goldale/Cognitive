blocks:
- text: 'The engineering pipeline separates physical decoding from semantic reconstruction: channel decoding produces
    symbols or perceptual features; contextual interpretation relates them to active memory; model integration proposes
    changes to the recipient world model; clarification is requested when ambiguity or conflict remains.'
  type: paragraph
- type: diagram
  title: Semantic Reconstruction Pipeline
  description: A decoded signal becomes meaningful only through preprocessing, contextual interpretation, and integration
    with the current world model.
