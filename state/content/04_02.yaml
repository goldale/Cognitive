  headers:
  - Interface point
  - Function
  rows:
  - - Internal-Language Extraction Point
    - Produces the shared internal representation used to initiate READ and to form UPDATE content.
  - - Memory Reinjection Point
    - Receives serialized memory after early external-form interpretation and integrates it into later
      Transformer computation.
