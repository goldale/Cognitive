- proportionality_priority: true
  readability_priority: true
  size: standard
  text: 'Current Architecture ↓

    Generate Candidate ↓

    Replay and Evaluate ↓

    Accept / Reject / Partially Apply ↓

    Repeat'
  type: diagram
- text: 'Candidate generation can initially be simple: alternative clusters, new indexes, split or merged categories, different retention thresholds, or different executor assignments.'
  type: paragraph
- text: Evaluation must include future utility, coherence, latency, complexity, retention of important knowledge, and the cost of transition. A candidate that performs better on one benchmark but destroys continuity is not automatically superior.
  type: paragraph
