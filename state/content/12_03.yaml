blocks:
- text: No general function is assumed to map changed weights directly to an optimal new architecture. The system must generate candidate organizations, evaluate them, retain useful changes, and repeat.
  type: paragraph
- title: Functional and Structural Learning
  description: Functional learning changes active weights; structural learning changes which connections exist and how topology is organized.
  direction: TB
  edges:
