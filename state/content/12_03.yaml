blocks:
- text: No general function is assumed to map changed weights directly to an optimal new architecture. The system
    must generate candidate organizations, evaluate them, retain useful changes, and repeat.
  type: paragraph
- type: diagram
  title: Functional and Structural Learning
  description: Functional learning changes active weights; structural learning changes which connections exist and
    how topology is organized.
  direction: TB
  nodes:
  - id: experience
    label: Experience
    kind: external
    status: current
  - id: functional
    label: Functional Learning
    kind: subsystem
    status: current
  - id: weights
    label: Weight Updates
    kind: state
    status: current
  - id: signals
    label: Connection State Signals
    kind: state
    status: current
  - id: structural
    label: Structural Learning
    kind: future
    status: future
  - id: topology
    label: Topology Changes
    kind: storage
    status: future
  edges:
  - from: experience
    to: functional
    flow: information
  - from: functional
    to: weights
    flow: learning
    label: online adaptation
  - from: experience
    to: signals
    flow: information
  - from: signals
    to: structural
    flow: learning
    label: offline evidence
  - from: structural
    to: topology
    flow: optimization
    label: create / remove links
  size: standard
  readability_priority: true
  proportionality_priority: true
- text: 'Current Architecture ↓

    Generate Candidate ↓

    Replay and Evaluate ↓

    Accept / Reject / Partially Apply ↓

    Repeat'
  type: diagram
  size: standard
  readability_priority: true
  proportionality_priority: true
- text: 'Candidate generation can initially be simple: alternative clusters, new indexes, split or merged categories,
    different retention thresholds, or different executor assignments.'
  type: paragraph
- text: Evaluation must include future utility, coherence, latency, complexity, retention of important knowledge,
    and the cost of transition. A candidate that performs better on one benchmark but destroys continuity is not
    automatically superior.
  type: paragraph
