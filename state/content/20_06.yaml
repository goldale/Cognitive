blocks:
- type: paragraph
  text: A mature memory system requires an explicit lifecycle rather than unlimited accumulation.
- type: definition
  title: Forgetting
  text: Controlled reduction of accessibility, precision, or persistence for knowledge whose expected utility no
    longer justifies its cost or interference risk.
- type: definition
  title: Memory Pruning
  text: Removal or compression of redundant, obsolete, low-confidence, or harmful structures according to validated
    policy.
- type: definition
  title: Structural Plasticity
  text: Modification of the topology of Associative Memory, including creation, strengthening, weakening, merging,
    separation, or removal of associations.
- type: list
  items:
  - Forgetting must be measurable and reversible where practical.
  - Pruning decisions should use importance, confidence, usage, redundancy, and interference evidence.
  - Structural learning must remain distinct from functional online learning.
  - Connection-level state may accumulate evidence for later topology changes.
  - No mechanism may silently violate persistent-memory integrity or provenance requirements.
