id: S_02_01
section_id: S_02_01
blocks:
- type: definition
  title: Internal Latent Interface
  text: The Transformer-facing neural interface through which UPDATE exports an internal latent state to Associative
    Memory and READ reinjects a memory-derived latent response into Transformer processing.
- type: definition
  title: UPDATE
  text: A native latent interaction that exposes a Transformer-produced internal state to Associative Memory for
    learning and D-Context evolution.
- type: definition
  title: READ
  text: A native latent interaction that returns a memory-derived internal representation to Transformer processing
    when an established D-Context makes retrieval meaningful.
- type: principle
  title: First-exchange rule
  text: The first exchange of a new Dialogue produces no READ because Associative Memory has no D-Context for that
    Dialogue. The first UPDATE establishes it.
- type: warning
  title: Interface semantics
  text: READ and UPDATE must not be drawn or described as network requests, textual commands, JSON messages, or
    an external message bus.
