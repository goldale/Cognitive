id: S_07_05
blocks:
- text: 'Pairwise preferences provide a practical signal: under a specified context, state A is preferred to state B. Ranking losses avoid requiring an absolute universal numerical scale.'
  type: paragraph
- text: Training data should include outcomes over different time horizons, reversals after new evidence, conflicts among channels, and cases in which immediate utility damages long-term capability.
  type: paragraph
- text: The evaluator itself requires slow consolidation. Rapidly adapting value weights can destabilize identity and permit transient noise or manipulation to reshape the entire system.
  type: paragraph
- title: Evaluator capture
  text: A system whose global evaluator can be modified by a single interaction is structurally vulnerable even when its inference model is strong.
  type: warning
section_id: S_07_02
