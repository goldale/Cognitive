blocks:
- text: High-bandwidth streams such as video contain large amounts of valid information that may not relate
    to the current dialogue or task. This information is not garbage and should not be mislabeled as noise.
  type: paragraph
- text: Task-conditioned preprocessing suppresses or postpones irrelevant detail while preserving the
    ability to recover it when goals change or uncertainty increases.
  type: paragraph
