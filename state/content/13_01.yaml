id: S_13_01
blocks:
- text: Consolidation should normally execute outside the interactive response path. A dialogue system
    must remain responsive; a consolidation system should be conservative, evidence-seeking, and willing
    to leave information unresolved.
  type: paragraph
- text: The biological analogy is sleep, but the engineering requirement is simply asynchronous processing
    with access to recent experience, current memory, objectives, and outcome feedback.
  type: paragraph
- text: An initial implementation can use scheduled jobs, replay buffers, clustering, confidence updates,
    and candidate evaluation without changing the base neural model.
  type: paragraph
- title: Different optimization criteria require different subsystems
  text: The dialogue component optimizes responsiveness and usefulness. The consolidation component optimizes
    long-term consistency, retention, and corrigibility.
  type: principle
section_id: S_06_01
