blocks:
- text: Local reorganization changes a bounded region of the knowledge graph or memory index. Global reorganization changes cross-domain evaluation, fundamental categories, objective priorities, or the relationship between memory and model.
  type: paragraph
- title: Offline Sleep and Structural Optimization
  description: A future sleep process replays experience, estimates importance, and proposes safe structural changes to memory.
  direction: TB
  edges:
  - flow: information
    from: state
    to: replay
  - flow: information
