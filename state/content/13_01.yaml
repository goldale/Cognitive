- text: Local changes should be common. Global changes should require stronger evidence because their errors propagate widely and can alter identity continuity.
  type: paragraph
- text: Only one major model should normally undergo cardinal restructuring at a time. Rate limits and staged evaluation reduce cascading adaptation to noise. Emergency exceptions remain possible when evidence indicates a global regime change.
  type: paragraph
- title: Conservative structural change
  text: Adapt quickly through weights and slowly through architecture.
  type: principle
