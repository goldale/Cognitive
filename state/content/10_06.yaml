- title: Implementation gap principle
  text: Existing systems solve important subproblems, but none already satisfies the complete Cognitive memory contract. The
    engineering task is to integrate them while adding dynamic Memory State, READ-only Memory Vector generation, feedback
    without implicit READ, separate UPDATE semantics, semantic invariance, and future topology optimization.
  type: principle
- level: 3
  text: Required Additions Before the Target Is Reached
  type: heading
- text: 'The combined implementation must still provide: persistent and short-term Memory State; spreading activation; online
    knowledge accumulation; semantic equivalence across wording and language; canonical Memory Vector normalization; explicit
    READ and UPDATE operations; Answer-to-Memory feedback that changes state without generating a vector; controlled forgetting;
    structural connection state; and later Sleep-like offline optimization.'
  type: paragraph
