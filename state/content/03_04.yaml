id: S_03_04
blocks:
- text: When multiple integrations remain possible or required background is absent, a rational cognitive
    system generates T_ClarificationRequest rather than silently selecting an arbitrary interpretation.
  type: paragraph
- text: Clarification questions are therefore not secondary social behavior. They are operations that
    reduce uncertainty inside T_ModelIntegration.
  type: paragraph
- title: T_Conflict
  text: A computational state in which received information cannot be integrated under the receiver's
    current model and constraints without unresolved inconsistency.
  type: definition
- text: T_Conflict is distinct from the social dynamics of argument. The project intentionally excludes
    dominance, persuasion, status, anger, and coalition behavior from this definition.
  type: paragraph
- text: T_ModelConflictResolution is an iterative search over additional evidence, revised definitions,
    confidence changes, local reorganization, or explicit retention of incompatible alternatives.
  type: paragraph
- title: Emergent emotional dynamics
  confidence: 0.62
  text: The current architecture does not require emotions to be designed as an isolated module. A working
    hypothesis is that emotion-like states may emerge from persistent agents interacting in groups, evaluating
    one another, competing or cooperating, remembering consequences, and adapting their behavior over
    time.
  type: hypothesis
section_id: S_02_04
