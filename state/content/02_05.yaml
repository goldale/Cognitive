id: S_02_05
blocks:
- text: Benchmarking a cognitive system without declaring its objective class can be meaningless. A model may underperform on one benchmark because its architecture preserves information needed for another objective.
  type: paragraph
- text: System design should therefore expose objective assumptions, allow objective revision, and measure the cost of reorganizing knowledge when objectives change.
  type: paragraph
- text: Population design should preserve several objective-driven lineages rather than globally replacing all systems with the current single champion.
  type: paragraph
- title: Objective declaration
  text: Every experiment on a world model should state the objective function, resource constraints, evaluation horizon, and model class for which performance is claimed.
  type: principle
section_id: S_03_06
