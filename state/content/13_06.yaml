- type: heading
  level: 3
  text: Stage 1 — Transformer baseline
- type: paragraph
  text: The Transformer learns interpretation, reasoning, planning, and generation before Associative Memory contains
    experience. The selected intermediate interface is identified and validated as the internal language.
- type: heading
  level: 3
  text: Stage 2 — D-Context and LTM1 vocabulary
- type: paragraph
  text: The first exchange of each new Dialogue is processed without READ. Its first UPDATE creates D-Context.
    Repeated internal-language states then teach LTM1 stable atoms, contexts, and associative matches.
- type: heading
  level: 3
  text: Stage 3 — LTM2 compositions and scenarios
- type: paragraph
  text: After LTM1 has enough stable vocabulary, LTM2 accumulates compositions, episodes, state transitions, and
    scenarios. The stages overlap, but the dominant learning priority shifts from vocabulary to experienced structure.
- type: warning
  title: Risk of ignored memory
  text: A capable Transformer may solve many tasks from parameters and current input alone. Training must therefore
    measure whether serialized memory messages causally improve Dialogue continuity, recall, prediction, or decisions.
- type: note
  title: No separate memory-language training
  text: The memory is not trained to invent or canonicalize a second language. It learns to organize, select, and
    serialize information in the Transformer-defined internal language.
