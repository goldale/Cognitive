kind: T_Content
section: S_13_06
blocks:
- type: paragraph
  text: Transformer is trained first and already defines the internal language. Associative Memory then develops
    inside that language, beginning empty and learning a Transformer-specific model of experienced reality.
- type: diagram
  title: Progressive Transformer-Specific Memory Training
  description: Training begins without memory participation, then forms D-Context, learns LTM1 vocabulary
    and contexts, and finally accumulates LTM2 episodes and scenarios.
