- type: note
  title: Canonical detailed specification
  text: Section 10.1 owns the complete Semantic Feedback Learning lifecycle, the READ and UPDATE contracts, and
    the rule that UPDATE never produces a Memory Vector. This overview intentionally does not repeat that complete
    definition.
- type: heading
  level: 3
  text: Operation asymmetry
- type: table
  headers:
  - Operation
  - Architectural purpose
  - Canonical owner
  rows:
  - - READ
    - Retrieve context without changing memory
    - Section 10.1
  - - UPDATE
    - Incorporate semantic learning into Memory State
    - Section 10.1
- type: paragraph
  text: The release-blocking READ/UPDATE invariants are defined canonically in Section 10.1 and in state/canonical/invariants.yaml.
- type: heading
  level: 3
  text: First-class self-learning process
- type: paragraph
  text: The Semantic Feedback Learning Pipeline is an independent architectural object with explicit stages, contracts,
    invariants, and future extension points for consolidation, replay, forgetting, structural plasticity, and evaluation.
