- type: heading
  level: 3
  text: Dialogue-aware READ and UPDATE
- type: table
  headers:
  - Dialogue phase
  - Memory participation
  - Result
  rows:
  - - First external exchange
    - No READ
    - Transformer processes the opening message; UPDATE creates Dialogue Context.
  - - Continuing exchange
    - READ before continued processing
    - Memory returns previous Dialogue content plus its relevant projection onto LTM1 and LTM2.
  - - After Transformer processing
    - UPDATE
    - Memory stores the new internal state and extends Dialogue Context.
- type: principle
  title: Relevant memory serialization
  text: Memory does not generate a separate Memory Vector language. It selects relevant distributed state and serializes
    it in the shared internal language.
- type: paragraph
  text: LTM1 remains a conservative associative graph and changes structurally only during Sleep. LTM2 accumulates
    dialogue history, compositions, episodes, and scenarios. STM carries ordered internal-language messages and
    maintains the active Dialogue.
- type: principle
  title: Asymmetric Transformer entry points
  text: External messages enter through early Transformer interpretation. Memory-facing state is extracted only
    after internal-language formation. Serialized memory returns through a deeper Memory Reinjection Point because
    it is already expressed in the shared internal language and does not require another translation pass.
- type: note
  title: Depth hypothesis
  text: The reinjection point is provisionally expected to lie approximately 20–30% of Transformer depth after the
    extraction point. This value is an experimental starting range, not a universal constant.
