- type: heading
  level: 3
  text: Dialogue-aware READ and UPDATE
- type: table
  headers:
  - Dialogue phase
  - Memory participation
  - Result
  rows:
  - - First external exchange
    - No READ
    - Transformer processes the opening message; UPDATE creates D-Context.
  - - Continuing exchange
    - READ before continued processing
    - Memory retrieves relevant information and returns serialized content in the Internal Language.
  - - After Transformer processing
    - UPDATE
    - Associative Memory updates D-Context and changes Memory state.
- type: principle
  title: Asymmetric Transformer entry points
  text: External messages enter through early Transformer interpretation. Serialized memory content returns through
    a deeper Memory Reinjection Point because it is already expressed in the Internal Language and does not require
    another translation pass.
- type: note
  title: Depth hypothesis
  text: The reinjection point is provisionally expected to lie approximately 20–30% of Transformer depth after the
    extraction point. This value is an experimental starting range, not a universal constant.
