- type: diagram
  title: One Possible READ/UPDATE Integration inside a Transformer
  description: An implementation-oriented illustration. At the Transformer layer where UPDATE is issued, the main
    hidden stream continues while Associative Memory processes UPDATE within its D-Context and returns READ content
    into additional hidden nodes. Subsequent Transformer layers integrate the two streams. The exact fusion mechanism
    remains implementation-dependent.
