- type: heading
  level: 3
  text: Dialogue-aware READ and UPDATE
- type: table
  headers:
  - Dialogue phase
  - Memory participation
  - Result
  rows:
  - - First external exchange
    - No READ
    - Transformer processes the opening message; UPDATE creates D-Context.
  - - Continuing exchange
    - READ before continued processing
    - Memory retrieves relevant information and returns serialized content in the Internal Language.
  - - After Transformer processing
    - UPDATE
    - Associative Memory updates D-Context and changes Memory state.
- type: principle
  title: Asymmetric Transformer entry points
  text: External messages enter through earlier Transformer processing. READ extraction, READ response reinjection, and UPDATE
    extraction may occur at distinct layers. Their optimal placement is implementation-dependent and is the subject of RS-0011.
- type: note
  title: RS-0011 layer-placement question
  text: The architecture does not prescribe a numerical depth offset. RS-0011 will investigate at which Transformer layer
    or layers READ extraction, READ response reinjection, and UPDATE extraction should occur.
