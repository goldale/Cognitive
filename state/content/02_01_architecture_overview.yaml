kind: T_Content
section: S_02_01_ARCH
blocks:
- type: paragraph
  text: Cognitive uses one shared internal language across Transformer, STM, LTM1, and LTM2. The language is defined
    by a selected intermediate representation of the trained Transformer; memory begins empty and develops as a
    Transformer-specific long-term model of experienced reality.
- type: principle
  title: Shared internal language
  text: Raw external data never enters Associative Memory. External input is first interpreted by Transformer. Both
    READ and UPDATE use the same internal-language representation.
- type: definition
  title: Dialogue
  text: A logically connected exchange of messages with the external world. The first exchange is processed without
    memory READ. Its first UPDATE creates Dialogue Context; later READ operations may then supply previous dialogue
    content and its projection onto long-term memory.
- type: diagram
  title: Transformer-Centric Memory Architecture
  description: External input is interpreted before memory access. Memory and Transformer communicate in one shared
    internal language.
  direction: LR
  size: standard
  readability_priority: true
  proportionality_priority: true
