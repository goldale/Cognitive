- type: diagram
  title: One Possible READ/UPDATE Integration inside a Transformer
  description: An implementation-oriented illustration. Earlier layers, the UPDATE extraction point, the continuing main hidden
    stream, additional hidden nodes carrying the READ response, and subsequent implementation-dependent integration all remain
    inside the Transformer. UPDATE is sent directly to D-Context processing inside Associative Memory; the selected READ response
    returns to the Transformer as additional hidden nodes. The exact extraction, reinjection, and fusion mechanisms remain
    implementation-dependent.
