kind: T_Content
blocks:
- text: Cognitive separates semantic reasoning, associative retrieval, persistent memory state, and self-learning
    while connecting them through explicit typed interfaces.
  type: paragraph
- title: Primary architectural principle
  text: The Transformer is both the Semantic Reasoning Engine and the Semantic Teacher of Associative Memory. Associative
    Memory learns from Transformer-produced Semantic Representations rather than raw external observations.
  type: principle
- title: Cognitive Master Information Lifecycle
  description: A system-level lifecycle view. External channels converge through the Input / STM path; the single
    physical LTM supplies associative context; one Transformer performs cognitive processing and memory-update work;
    offline structural adaptation modifies the same Associative Memory rather than forming a separate subsystem.
  direction: LR
