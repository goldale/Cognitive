kind: T_Content
section: S_02_01_ARCH
blocks:
- type: paragraph
  text: Cognitive is organized around a Transformer-defined Internal Language. External information is interpreted
    by Transformer before any memory operation, and all communication with Memory uses messages expressed in that
    Internal Language.
- type: principle
  title: Internal Language as the system interface
  text: Transformer determines and uses the Internal Language. Every cognitive subsystem communicates through that
    language rather than through a subsystem-specific representation.
- type: definition
  title: Dialogue
  text: A logically connected exchange of messages with the external world. Dialogue provides the continuity within
    which Transformer requests memory retrieval and sends memory updates.
- type: definition
  title: Associative Memory
  text: The memory subsystem that maintains experience-specific state and interacts with Transformer exclusively
    through UPDATE input and READ output expressed in the Internal Language.
- type: definition
  title: UPDATE
  text: The operation by which Transformer sends a new Internal Language state to Associative Memory. UPDATE may
    create or modify Memory State and the active Dialogue Context.
- type: definition
  title: READ
  text: The operation by which Associative Memory returns relevant serialized memory content to Transformer without
    modifying persistent Memory State.
- type: definition
  title: Dialogue Context (D-Context)
  text: The evolving state of one Dialogue maintained only inside Associative Memory. The first UPDATE creates the
    D-Context, later UPDATE operations extend it, and READ uses it to select relevant memory content.
- type: diagram
  title: Transformer-Centric Memory Architecture
  description: External Request enters Preprocessing. The semantic response is generated in the central Transformer
    stage, which exchanges READ and UPDATE messages with Associative Memory through the Internal Language. Postprocessing
    generates the final form of the External Response.
