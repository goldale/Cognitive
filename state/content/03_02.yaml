kind: T_Content
section: S_03_02
blocks:
- type: paragraph
  text: The internal language is obtained from a selected intermediate Transformer representation or from a stable
    projection of that representation. The architecture does not prescribe one universal layer number.
- type: principle
  title: Implementation-dependent layer selection
  text: Transformer specialists must select and justify the layer, layer combination, or learned projection that
    best preserves semantic stability, compositionality, context, and bidirectional usability by memory.
- type: table
  headers:
  - Required property
  - Reason
  rows:
  - - Semantic stability
    - Equivalent meanings should produce sufficiently compatible memory interactions.
  - - Context sensitivity
    - The same element in different contexts must remain distinguishable.
  - - Bidirectional usability
    - Memory output must be consumable by later Transformer processing.
  - - Dimensional stability
    - Persistent memory must not depend on incidental runtime tensor layout.
  - - Task relevance
    - The representation must retain distinctions needed by the trained Transformer and its objectives.
- type: warning
  title: Not an arbitrary hidden state
  text: A raw hidden state is not automatically a suitable architectural interface. The selected representation
    requires empirical validation and may need a stable normalization or projection.
- type: paragraph
  text: The interface is Transformer-specific. Replacing Transformer may require migration, adaptation, or reconstruction
    of memory because another model may define a different internal semantic space.
- type: heading
  level: 3
  text: Asymmetric Extraction and Reinjection
- type: principle
  title: Asymmetric Transformer interface
  text: The point that extracts a memory-facing internal-language state and the point that receives serialized memory
    are distinct. External input must first be translated by early Transformer layers. Memory output is already
    expressed in the shared internal language and is therefore reinjected deeper, into layers responsible for semantic
    integration, reasoning, planning, and response formation.
- type: formula
  text: external input -> early interpretation -> internal-language extraction point -> READ
- type: formula
  text: serialized memory -> deeper reinjection point -> integration and reasoning
- type: principle
  title: No repeated translation
  text: Serialized memory must not be routed through the same early layers that translate raw external form. Reprocessing
    internal-language memory as external input is redundant and may distort the preserved semantic state.
- type: note
  title: Working depth hypothesis
  text: A working hypothesis is that the Memory Reinjection Point should be approximately 20–30% of Transformer
    depth later than the Internal-Language Extraction Point. The exact offset is implementation-dependent and must
    be established experimentally for each Transformer family.
- type: diagram
  title: Asymmetric Transformer–Memory Interface
  description: External input enters at the Transformer front and is translated by early layers before the Internal-Language
    Extraction Point. READ is initiated from that point. Serialized memory already uses the shared internal language
    and is reinjected deeper, directly into integration and reasoning layers.
