- title: Feedback invariant
  text: Transformer output returns to Memory State as an internal observation. This feedback may change short-term
    activation or other internal memory state, but it does not invoke Projection and does not generate a new Memory
    Vector. A Memory Vector is produced only by a later explicit READ operation.
  type: principle
- title: Functional lossiness
  confidence: 0.78
  text: Memory loss and reconstruction are partly selected because they improve integration and future action, not
    only because biological storage is limited.
  type: hypothesis
- text: The relevant evolutionary objective is not historical fidelity. It is successful behavior under resource
    constraints. A memory architecture that preserves fewer literal details but produces a more usable model can
    outperform an exact archive.
  type: paragraph
