kind: T_ContentBlock
id: S_09_01
blocks:
- text: Planning does not directly answer what to do. It constructs a bounded set of possible actions
    and multi-step scenarios. Each scenario includes predicted states, branch probabilities, temporal
    attributes, resource requirements, and uncertainty.
  type: paragraph
- title: Planning a move in a chess game
  text: When planning a chess move, the system does not seek one move in isolation. It generates a bounded
    tree of candidate moves, likely replies, subsequent continuations, branch probabilities or confidence
    estimates, and time costs. Integrated Evaluation compares the resulting scenarios and selects the
    best available move before the available thinking time expires.
  type: example
- title: Bounded Planning and Action Selection
  description: Planning generates multiple temporally attributed alternatives; Integrated Evaluation selects
    among them under a processing budget.
  direction: TB
