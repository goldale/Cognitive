blocks:
- text: Biological memory does not behave as a precise archive. Recall is selective, reconstructive, context-dependent,
    and vulnerable to systematic distortion. The project generalizes this observation from human memory to biological
    memory in organisms with developed nervous systems, while acknowledging that direct measurement becomes increasingly
    difficult outside humans.
  type: paragraph
- type: diagram
  title: Memory Architecture
  description: Memory State combines persistent associative structure with dynamic short-term activation. An explicit
    READ produces the canonical Memory Vector for the Transformer; Transformer output returns to Memory State as
    feedback without generating another Memory Vector.
  direction: TB
