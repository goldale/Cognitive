kind: T_ContentBlock
schema_version: 0.3.34
id: S_10_03
blocks:
- text: In a normal read cycle, an external utterance activates Associative Memory, which produces a Memory Vector used by the Transformer to generate a response.
  type: paragraph
- title: Memory UPDATE Path
  description: The completed interaction and Transformer state are used to update memory without generating a second user-visible answer.
  direction: TB
  edges:
  - flow: information
    from: question
    to: update
  - flow: information
    from: answer
    to: update
  - flow: information
    from: hidden
    label: non-zero mode signal
    to: update
  - flow: learning
    from: update
    label: learning request
    to: memory
  - flow: learning
    from: memory
    label: content update
    to: state
  nodes:
  - kind: data
    id: answer
    status: current
    label: Generated Answer
  - kind: state
    id: hidden
    status: current
    label: Transformer Hidden State
  - kind: subsystem
    id: memory
    status: current
    label: Associative Memory
  - kind: data
    id: question
    status: current
    label: Last Question
  - kind: state
    id: state
    status: current
    label: Updated Memory State
  - kind: subsystem
    id: update
    status: current
    label: UPDATE_ONLY
  proportionality_priority: true
  readability_priority: true
  size: standard
  type: diagram
- text: In an UPDATE_ONLY cycle, the last question, answer, and relevant Transformer hidden state are supplied to memory so that experience can be integrated without rerunning a full user-facing inference cycle.
  type: paragraph
section_id: S_16_03
