blocks:
- type: paragraph
  text: Logical Episode boundaries may be supplied by the source, implied by the activation stream, or inferred
    from combined context.
- type: warning
  title: ARCHITECTURAL DECISION REQUIRED
  text: Define which mechanism determines Logical Episode start, continuation, interruption, resumption, and end
    when these are not supplied explicitly by the source. The current canonical architecture does not assign this
    responsibility to a dedicated physical component.
- type: paragraph
  text: Completed Logical Episodes are integrated into Associative Memory through the latent UPDATE interaction.
    Their internal order and causal hypotheses are represented by the resulting LTM structures and edge lists.
