- text: Sleep-like structural reorganization and the final global evaluation mechanism are intentionally
    deferred from the first implementation of the Transformer-memory interface.
  type: paragraph
- text: Deferral is an architectural boundary, not rejection. Initial versions should establish a working
    memory contract before adding offline topology optimization, forgetting, global reweighting, and more
    general evaluation.
  type: paragraph
