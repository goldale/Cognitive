blocks:
- text: An internal clock provides a shared reference for incoming signals, system actions, and state
    transitions. Exact physical time is not always necessary, but consistent ordering and elapsed-time
    estimates are essential.
  type: paragraph
- text: Planning budgets are themselves temporal constraints. When the budget expires, the system should
    execute the best available option, continue planning in parallel when safe, or choose a protective
    fallback.
  type: paragraph
section_id: S_15_05
