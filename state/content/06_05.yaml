blocks:
- text: Strong integration conflicts with Git-friendly local changes. Altering one experience can influence many later reconstructions. An external symbolic state remains useful for audit, collaboration, and project management even if the internal memory becomes nonlocal.
  type: paragraph
- text: 'This produces two representations: an internal integrated state optimized for cognition and an external symbolic Research State optimized for human review, versioning, branching, and controlled exchange.'
  type: paragraph
