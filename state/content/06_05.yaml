blocks:
- text: Classical systems primarily maximize data throughput. AI-native systems should maximize useful
    knowledge made available to reasoning per unit of computational cost and time.
  type: paragraph
- text: The optimal preprocessing architecture is determined not by stream type or bandwidth alone, but
    by expected effect on goals, decisions, and Memory State.
  type: paragraph
