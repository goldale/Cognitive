blocks:
- text: The objective of planning is to construct the most useful set of plausible developments, not an exhaustive set of all possible futures. Search is bounded by time, memory, computation, maximum scenario count, and required response latency.
  type: paragraph
- text: When delay is dangerous, the architecture must prefer a sufficiently evaluated action over indefinite analysis. In practical terms, an imperfect action may be safer than remaining motionless while the environment continues to change.
  type: paragraph
section_id: S_14_04
