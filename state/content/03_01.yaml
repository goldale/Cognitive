  - kind: data
    id: signal
    status: current
    label: Serialized Signal
  proportionality_priority: true
  readability_priority: true
  size: standard
  type: diagram
- text: The receiver does not reconstruct the sender's model. It uses the received sequence to extend or reorganize its own model until the message appears interpretable within the receiver's current world model.
  type: paragraph
- text: 'Sender Model ↓

    T_PartialSerialization ↓

    Communication Channel ↓

    T_Deserialization ↓

    T_ModelIntegration ↓

    Modified Receiver Model'
  type: formula
- text: The adjective partial is essential. A mature cognitive state is too integrated and too large to serialize completely through ordinary communication. The message is meaningful only against a background already present in the receiver.
  type: paragraph
section_id: S_02_01
