kind: T_Content
section: S_03_01
blocks:
- type: paragraph
  text: The internal language is the central organizing concept of Cognitive. It is not invented by empty memory
    and is not an independent protocol layered above Transformer cognition. It is inherited from a selected intermediate
    representation of the trained Transformer.
- type: principle
  title: Foundational axiom
  text: Transformer, STM, LTM1, and LTM2 communicate through one internal language. No subsystem defines a second
    semantic language requiring translation.
- type: paragraph
  text: The trained Transformer therefore establishes the semantic coordinate system before Associative Memory contains
    any experience. Memory begins empty and develops as a Transformer-specific model of the experienced world.
- type: definition
  title: Short-Term Memory (STM)
  text: The short-term transport substrate inside Associative Memory that orders internal-language messages and
    supports the active D-Context.
- type: definition
  title: Long-Term Memory 1 (LTM1)
  text: The associative layer containing Internal Language Atoms and their Atom Semantic Contexts.
- type: definition
  title: Atom Semantic Context (Atom S-Context)
  text: The semantic context associated with an Internal Language Atom and used to constrain associative interpretation
    and retrieval.
- type: definition
  title: Long-Term Memory 2 (LTM2)
  text: The long-term layer that stores compositions, episodes, scenarios, and Dialogue history expressed in the
    Internal Language.
- type: definition
  title: Dialogue Context (D-Context)
  text: The evolving state of one Dialogue maintained only inside Associative Memory and used by READ to select
    relevant memory content.
- type: definition
  title: READ and UPDATE
  text: READ returns serialized memory content to Transformer; UPDATE sends a new Transformer-produced state into
    Associative Memory. Both use the Internal Language.
- type: diagram
  title: The Internal Language at the Center of Cognitive
  description: The trained Transformer is the source of the Internal Language used by STM, LTM1, and LTM2. External
    requests are interpreted by Transformer before memory access; memory returns serialized messages in the Internal
    Language.
