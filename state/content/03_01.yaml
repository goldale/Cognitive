id: S_03_01
blocks:
- text: Communication does not transfer a cognitive model. A sender selects a limited fragment of its internal state and transforms that fragment into a sequence suitable for an external channel. This operation is T_PartialSerialization.
  type: paragraph
- title: Communication and Semantic Reconstruction
  description: Communication transfers a partial serialized signal; the receiver reconstructs meaning using its own context and memory.
  direction: LR
  edges:
  - flow: information
    from: model_a
    to: serialize
  - flow: information
    from: serialize
    to: signal
  - flow: information
    from: signal
    to: decode
  - flow: information
    from: decode
    to: representation
  - flow: context
    from: context
    label: conditions interpretation
    to: representation
  - flow: information
    from: representation
    to: integration
  nodes:
  - kind: state
    id: context
    status: current
    label: Receiver Context and Memory
  - kind: subsystem
    id: decode
    status: current
    label: Decoding and Preprocessing
  - kind: subsystem
    id: integration
    status: current
    label: Model Integration
  - kind: state
    id: model_a
    status: current
    label: Internal Model A
  - kind: state
    id: representation
    status: current
    label: Reconstructed Semantic Representation
  - kind: subsystem
    id: serialize
    status: current
