kind: T_Content
section: S_03_01
blocks:
- type: paragraph
  text: The shared internal language is the central organizing concept of Cognitive. It is not invented by empty
    memory and is not an independent protocol layered above Transformer cognition. It is inherited from a selected
    intermediate representation of the trained Transformer.
- type: principle
  title: Foundational axiom
  text: Transformer, STM, LTM1, and LTM2 communicate through one shared internal language. No subsystem defines
    a second semantic language requiring translation.
- type: paragraph
  text: The trained Transformer therefore establishes the semantic coordinate system before Associative Memory
    contains any experience. Memory begins empty and develops as a Transformer-specific model of the experienced
    world.
- type: diagram
  title: The Internal Language at the Center of Cognitive
  description: External signals become internal-language representations before memory access. Memory returns
    relevant information in the same language.
  direction: LR
