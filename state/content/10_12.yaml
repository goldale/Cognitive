id: S_10_12
blocks:
- title: Input Buffer
  text: The canonical input path contains a modality-neutral Input Buffer between external or internal sources and
    STM. The buffer is not semantic memory, does not store objects or addresses, and performs no lookup. It temporarily
    holds a linearly ordered stream of input elements.
  type: definition
- title: Sequencer
  text: The Sequencer is the Input / STM component that orders the combined buffered stream, performs representation
    normalization required by the input path, proposes Logical Episode boundaries, and prepares the active sequence
    for STM and associative retrieval. It performs no general reasoning. A dedicated lightweight Transformer may
    be used internally only as an implementation fallback for difficult boundary cases; this does not create a second
    architectural Transformer subsystem.
  type: definition
- title: Canonical input path
  description: Language / Messages and Stream Input are equal external channels. They converge on one modality-neutral
    Input Buffer. The Sequencer orders and normalizes the combined stream before forming the active Semantically
    Neutral STM sequence, which projects physically into LTM-1.
  direction: LR
  edges:
  - flow: information
    from: language
    label: transfer
    to: buffer
  - flow: information
    from: stream
    label: transfer
    to: buffer
  - flow: control
    from: buffer
    label: ordering · normalization · segmentation
    to: sequencer
  - flow: information
    from: sequencer
    label: active linear sequence
    to: stm
  - flow: information
    from: stm
    label: fixed physical projections
    to: ltm
  nodes:
