id: S_10_12
blocks:
- title: Input Buffer
  text: The Stage-1 input path contains a modality-neutral Input Buffer between external or internal sources and
    STM. The buffer is not semantic memory, does not store objects or addresses, and performs no lookup. It temporarily
    holds a linearly ordered stream of input elements.
  type: definition
- title: Canonical Stage-1 input path
  description: Multiple external and internal sources write completed events directly into a linear or circular
    Input Buffer. The Input Buffer is itself a queue protected by a mutex. Each buffer element has one permanent
    physical projection to the corresponding STM node.
  direction: TB
  edges:
  - flow: information
    from: sources
    label: mutex-protected enqueue
    to: buffer
  - flow: information
    from: buffer
    label: permanent 1:1 physical projections
    to: stm
  - flow: information
    from: stm
    label: fixed physical projections
    to: ltm
  nodes:
  - kind: external
    id: sources
    label: Vision · Hearing · Touch · Language · Internal Sources
  - kind: state
    id: buffer
    label: 'Linear / Circular Input Buffer

      queue protected by mutex'
  - kind: subsystem
    id: stm
    label: Semantically Neutral STM
  - kind: storage
    id: ltm
    label: Semantic LTM
  proportionality_priority: true
  readability_priority: true
  size: standard
  type: diagram
- title: Mutex-protected Input Buffer queue
  text: The Linear / Circular Input Buffer is itself the queue protected by a mutex. Sources enqueue the next available
    completed input event directly into the next Input Buffer element. The queue does not interpret, prioritize,
    semantically route, or select destinations.
  type: principle
- title: Linear filling and implicit time
  text: Input Buffer elements are filled sequentially. Their insertion order defines the system-observed temporal
    order. Time is therefore implicit in buffer position and activation order rather than stored as a timestamp
    coordinate inside each event.
  type: principle
- text: Sequential insertion establishes temporal precedence. Causal dependence arises when earlier STM activation
    contributes to later STM activation. The documentation must not equate mere order with proven external-world
    causality.
  type: warning
- title: Input Buffer element
  text: Each Input Buffer element is a modality-neutral physical element with a fixed-dimensional activation vector.
    The current Stage-1 working dimensionality is eight coordinates. The same physical element may be populated
    at different times from vision, hearing, touch, language, another external source, or an internal source.
  type: definition
- text: '[v1, v2, v3, v4, v5, v6, v7, transmission_context]'
  type: formula
- title: Transmission Context
  text: One coordinate of the fixed eight-dimensional vector is reserved for service-level transmission context.
    At Stage 1 its primary role is to preserve the source or mode of the current signal. It does not encode the
    semantic identity of the observed Item.
  type: definition
- title: Fixed dimensional correspondence
  text: The number of Input Buffer elements equals the number of STM nodes. The vector dimensionality of one Input
    Buffer element equals the runtime state dimensionality of one STM node. Each buffer element has exactly one
    permanent physical connection to one corresponding STM node.
  type: principle
- text: '|Input Buffer elements| = |STM nodes|; D_buffer_element = D_STM_node; total runtime dimensionality = N
    × D.'
  type: formula
- title: No semantic specialization
  text: Buffer positions and STM nodes do not belong permanently to modalities or Items. A position number identifies
    only a physical place in the current sequential stream. The transmission-context coordinate carries source information
    for the current event.
  type: principle
- title: MN-0001 — Alternative parallel input processing
  object_id: MN-0001
  text: A deferred alternative uses a pool of identical input-processing paths. A free path temporarily connects
    to a data source, processes one event, publishes the result, and returns to the pool. Parallel completion can
    reorder observations. More importantly, events from different source streams may belong to the same Logical
    Episode and may participate in one causal chain. Independent per-stream segmentation can assign such events
    to different episodes and break cross-stream causal continuity. Because final episode-boundary detection requires
    the combined context of all relevant streams, this alternative is not canonical. It may be reconsidered only
    if observation order, processing order, publication order, and cross-stream causal coherence are all preserved.
  type: note
section_id: S_10_12
