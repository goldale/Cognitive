blocks:
- type: paragraph
  text: The Transformer and Associative Memory should be trained in stages rather than optimized as a single coupled
    system from the beginning. This reduces optimization complexity and gives each subsystem a stable role before
    the Memory Vector interface is activated.
- type: diagram
  title: Progressive Training Strategy
  description: Training begins with a fixed null Memory Vector, then activates the real memory interface, verifies
    that the Transformer uses it, and finally permits joint adaptation.
