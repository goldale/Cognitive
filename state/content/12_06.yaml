id: S_12_06
blocks:
- text: The Transformer and Associative Memory should be trained in stages rather than optimized as a single coupled system from the beginning. This reduces optimization complexity and gives each subsystem a stable role before the Memory Vector interface is activated.
  type: paragraph
- title: Progressive Training Strategy
  description: Training begins with a fixed null Memory Vector, then activates the real memory interface, verifies that the Transformer uses it, and finally permits joint adaptation.
  direction: TB
  edges:
  - flow: interface
    from: stage1
    label: fixed input
    to: 'null'
  - flow: learning
    from: 'null'
    to: stable
  - flow: control
    from: stable
    label: activate memory
    to: stage2
  - flow: interface
    from: stage2
    to: real
  - flow: evaluation
    from: real
    to: verify
  - flow: learning
    from: verify
    label: when effective
    to: joint
  nodes:
