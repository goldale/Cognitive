- type: heading
  level: 3
  text: Stage 1 — Transformer Training with a Null Memory Vector
- type: paragraph
  text: During the first stage, the Transformer receives a fixed canonical null Memory Vector, normally the all-zero
    vector. The Transformer learns language interpretation, reasoning, planning, and answer generation without depending
    on an immature external memory subsystem.
- type: principle
  title: Null-interface invariant
  text: The dimensionality and placement of the Memory Vector interface should already match the final architecture
    even while its value is fixed at zero. This prevents a later interface-shape change from becoming entangled
    with memory integration.
- type: heading
  level: 3
  text: Stage 2 — Associative Memory Integration
- type: paragraph
  text: After the Transformer baseline has stabilized, Associative Memory is enabled and explicit READ operations
    begin supplying non-zero canonical Memory Vectors. Training then teaches the Transformer to condition its reasoning
    on this additional source of knowledge.
- type: warning
  title: Risk of ignoring the Memory Vector
  text: Because the Transformer may already solve many tasks from its parameters and input context, ordinary optimization
    may converge while the model largely ignores the Memory Vector.
- type: heading
  level: 3
  text: Possible forced utilization
- type: paragraph
  text: It may therefore be necessary to force Memory Vector utilization during part of training. Candidate mechanisms
    include examples that cannot be solved without memory, controlled removal of equivalent context, auxiliary losses
    measuring memory dependence, progressive gating, or temporary constraints on the parameter-only path.
- type: note
  title: Open engineering question
  text: The specification does not select a single forcing mechanism. The requirement is to measure whether the
    Memory Vector causally influences the answer and to introduce a forcing mechanism if passive integration is
    insufficient.
- type: heading
  level: 3
  text: Stage 3 — Joint Adaptation
- type: paragraph
  text: Joint adaptation should begin only after the Transformer can use the Memory Vector and Associative Memory
    has reached sufficient representational maturity. The two subsystems remain independently replaceable because
    the canonical Memory Vector is their stable public interface.
