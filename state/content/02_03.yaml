id: S_02_03
section_id: S_02_03
blocks:
- type: paragraph
  text: Reasoning, Planning, Temporal Organization, Semantic Representation, and Integrated Evaluation describe
    cognitive functions or observable processing responsibilities. They do not imply independent code modules, services,
    parsers, or symbolic engines.
- type: principle
  title: Physical-versus-functional rule
  text: A function may appear as a chapter and may be experimentally isolated, but it must not be rendered as a
    separate physical component unless the canonical architecture explicitly assigns it an independent implementation
    boundary.
