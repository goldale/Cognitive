kind: T_ContentBlock
id: S_10_13
blocks:
- title: Physical order is not a Logical Episode
  text: The Input Buffer produces one branch-free linear observation stream. This physical order preserves the sequence
    in which Cognitive receives events, but it does not define where a semantically coherent Logical Episode begins
    or ends.
  type: principle
- text: E₁ → E₂ → E₃ → E₄ → E₅ → …
  type: formula
- title: Logical Episode boundaries
  text: The beginning and end of a Logical Episode are inferred from the combined semantic context of the buffered
    stream. The logical beginning need not coincide with the physical beginning of the Input Buffer.
  type: definition
- title: Sequencer boundary detection
  text: The Sequencer normally analyzes the combined buffered stream and returns candidate start and end boundaries
    together with confidence. If it cannot determine the boundaries with sufficient confidence, the same task is
    delegated to the main Transformer, which makes the final boundary decision. The Sequencer is part of the Input
    / STM subsystem and is not itself a Transformer.
  type: principle
- title: Boundary detection and final processing are distinct
  text: Repeated boundary analysis by the Sequencer and final processing of a completed Sequence are distinct operations.
    After both boundaries are known, the main Transformer processes the complete Sequence and produces one contextual
    data vector for every participating element.
  type: principle
- title: Logical Episode processing path
  description: The selected Input Buffer segment is represented as a linear Sequence in STM. The main Transformer
    converts that temporal representation into a possibly branched causal episode graph and integrates it into the
    same physical LTM through MSG2.
  direction: TB
  edges:
  - flow: information
    from: buffer
    label: combined buffered stream
    to: boundary
  - flow: control
    from: boundary
    label: start and end
    to: sequence
  - flow: information
    from: sequence
    label: completed linear Sequence
    to: transformer
  - flow: information
    from: transformer
    label: 'MSG2: contextual vectors + causal topology'
    to: ltm
  nodes:
  - kind: state
    id: buffer
    label: Input Buffer
  - kind: control
    id: boundary
    label: 'Sequencer

      (main Transformer fallback)'
  - kind: state
    id: sequence
    label: Linear STM Sequence
  - kind: subsystem
    id: transformer
    label: Main Transformer
  - kind: storage
    id: ltm
    label: Single Physical LTM
  proportionality_priority: true
  readability_priority: true
  size: standard
  type: diagram
- title: Canonical consolidation unit
  text: The canonical unit integrated into LTM through MSG2 is the completed Sequence selected by the inferred Logical
    Episode boundaries, together with the main Transformer output that defines per-element contextual data and causal
    graph topology.
  type: principle
- title: Sequence
  text: A completed Sequence determines the set of vertices belonging to one Logical Episode and preserves their
    original temporal order in STM. It does not determine the topology of the episode graph.
  type: definition
- title: Temporal-to-causal transformation
  text: The main Transformer determines directed causal relations between the corresponding vertices. The resulting
    episode graph may be branched, convergent, divergent, or disconnected and is not required to preserve the linear
    topology of the Sequence.
  type: principle
- text: 'STM Sequence: A → B → D → E    ⇒    LTM episode graph: A → B, A → D, D → E'
  type: formula
- title: Sequence lifetime
  text: The Sequence remains active in STM until the completed Logical Episode has been successfully committed to
    LTM-2. After a successful commit, the beginning of the circular input buffer advances to the next Sequence,
    making the committed Sequence no longer part of STM.
  type: principle
- title: Architectural boundary
  items:
  - Input Buffer remains sequential, branch-free, fixed-size, circular, and semantically neutral.
  - Logical Episode boundaries are independent of physical Input Buffer boundaries.
  - A Sequence represents temporal input order; an episode graph represents causality.
  - No cognitive addresses or global episode identifiers are introduced.
  type: list
section_id: S_10_13
