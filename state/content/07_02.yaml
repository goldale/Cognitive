blocks:
- text: D-Context organizes temporally related observations into episodes and owns episode-boundary semantics.
    Episodes preserve local order, duration, concurrency, interruption, and the distinction between an event and
    a persistent state.
  type: paragraph
- text: Temporal organization is separate from semantic meaning and evaluation, although all three interact
    during interpretation and planning.
  type: paragraph
