blocks:
- type: paragraph
  text: Memory Vector canonicalization should be introduced as a sequence of increasingly demanding normalization
    stages. The stages must not be collapsed into one operation because each depends on evidence that becomes available
    only after the previous stage and the Memory State have stabilized.
- type: diagram
  title: Sequential Memory Vector Normalization
  description: 'The Memory Vector representation is normalized progressively: first by length, then by statistical
    orthogonalization after representation stability, and finally by sparse basis rotation while preserving semantic
    content.'
  direction: TB
  size: standard
  readability_priority: true
  proportionality_priority: true
