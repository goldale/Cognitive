id: S_11_06
blocks:
- text: Memory Vector canonicalization should be introduced as a sequence of increasingly demanding normalization stages. The stages must not be collapsed into one operation because each depends on evidence that becomes available only after the previous stage and the Memory State have stabilized.
  type: paragraph
- title: Sequential Memory Vector Normalization
  description: 'The Memory Vector representation is normalized progressively: first by length, then by statistical orthogonalization after representation stability, and finally by sparse basis rotation while preserving semantic content.'
  direction: TB
  edges:
  - flow: information
    from: raw
    to: l2
  - flow: evaluation
    from: l2
    label: continue training
    to: stable
  - flow: control
    from: stable
    label: after stabilization
    to: orth
  - flow: optimization
    from: orth
    to: rotate
  - flow: interface
    from: rotate
    label: preserve meaning
    to: canonical
  nodes:
  - kind: interface
    id: canonical
    status: future
    label: 'Canonical

      Memory Vector'
  - kind: subsystem
    id: l2
    status: current
    label: 'Stage 1

      Length Normalization'
  - kind: subsystem
    id: orth
    status: future
    label: 'Stage 2

      Covariance Analysis and

      Orthogonal Coordinate Transformation'
