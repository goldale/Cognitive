- type: heading
  level: 3
  text: Stage 1 — Length Normalization
- type: paragraph
  text: At the initial integration stage, every non-zero raw Memory Vector is normalized by its Euclidean length
    before it is delivered to the Transformer. The vector direction carries the activated semantic pattern, while
    the original length is retained separately as activation magnitude. A zero raw vector maps to the canonical
    null Memory Vector and is never divided by zero.
- type: principle
  title: Initial normalization rule
  text: Length normalization is the only normalization that should be assumed before sufficient representative Memory
    Vector statistics exist. Early coordinates may be provisionally treated as independent, but that assumption
    is not evidence that the learned coordinates are actually orthogonal.
- type: heading
  level: 3
  text: Stage 2 — Statistical Orthogonalization
- type: paragraph
  text: After Associative Memory has stabilized enough that semantically equivalent inputs generate nearby Memory
    Vectors, a representative sample of vectors is collected. Its covariance or correlation matrix is estimated.
    A whitening or related coordinate transformation is then learned so that off-diagonal covariance becomes negligible
    and redundant coordinate coupling is reduced.
- type: warning
  title: Do not orthogonalize an unstable representation
  text: Applying covariance-based basis changes while Memory State is still changing rapidly would optimize a transient
    distribution and could make the public interface less stable. Orthogonalization therefore follows semantic stabilization
    rather than preceding it.
- type: heading
  level: 3
  text: Stage 3 — Sparse Basis Rotation
- type: paragraph
  text: Once an approximately orthogonal coordinate system has been obtained, an additional rotation may be optimized
    to minimize the number of non-zero or materially active coordinates for simple input assertions. The objective
    is a sparse canonical representation in which each axis corresponds as closely as practical to one independent
    semantic property.
- type: note
  title: Separate objectives
  text: Orthogonality removes second-order statistical coupling. Sparse rotation reduces active coordinate count.
    Semantic interpretability is a further objective and is not guaranteed automatically by either operation.
- type: principle
  title: Semantic preservation invariant
  text: Every normalization stage may change the coordinate system and interface statistics, but it must preserve
    the knowledge represented by Memory State. Representation Optimization is therefore distinct from learning,
    UPDATE, and structural reorganization.
