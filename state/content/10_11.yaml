kind: T_ContentBlock
id: S_10_11
blocks:
- title: Epistemic status
  text: Working Stage-1 architectural hypothesis. It fixes the present discussion state without claiming that the
    eventual biological or hardware implementation is already known. Later evidence may revise the hypothesis only
    through an explicit release-level architectural change.
  type: warning
- title: Single physical LTM with two logical domains
  text: The architecture contains one physical Long-Term Memory vertex and connection array. LTM-1 and LTM-2 are
    not separate physical memories. They are orthogonal logical domains implemented through different message types
    and message-specific state subspaces within the same physical LTM.
  type: principle
- title: LTM-1
  text: LTM-1 is the semantic logical domain of the single physical LTM. It contains stable Items of the world,
    basic properties, and a small bounded set of fundamental relations. Examples include chair–sit and bed–lie.
    In the initial architecture it is treated as effectively immutable, analogous to the initially cloned Transformer.
  type: definition
- title: LTM-2
  text: LTM-2 is the episodic logical domain of the same physical LTM. It stores completed Logical Episodes through
    MSG2 while remaining physically co-located with LTM-1 and isolated from it by an orthogonal message-specific
    state subspace.
  type: definition
- items:
  - An Item may later acquire a formally defined attribute set.
  - An Item may have more than one basic relation, with an initial working limit of no more than eight.
  - LTM-1 does not initially store the personal event sequences generated during operation.
  - LTM-1 is not a Vector Database, Knowledge Graph, or GraphRAG system; such mechanisms may support READ only.
  type: list
- title: Semantically neutral STM
  text: STM contains no objects, labels, addresses, or intrinsic Item attributes. Its nodes are semantically neutral.
    Meaning arises only through the physical interaction of STM activity with LTM-1.
  type: principle
- title: Physical topology of STM
  text: STM is a fixed, fully connected, non-directed physical network. The physical connectivity is not created,
    deleted, or oriented for each sequence. The state of excitation changes rapidly; the underlying complete connectivity
    does not.
  type: definition
- title: Sequence
  text: 'A Sequence is a directed linear activation graph formed within the fully connected STM from the Input Buffer
    segment identified as one Logical Episode. It is a direct reflection of that segment: every buffered element
    is represented by one activated STM node, and directed activation links preserve the original input order.'
  type: definition
- text: Identified Input Buffer segment → directed linear STM Sequence
  type: formula
- items:
  - A Sequence is not an address chain or a permanently created set of physical links.
  - A Sequence is linear and preserves the observed temporal order of the selected Input Buffer segment.
  - Its direction represents input order, not causal structure.
  - Different Sequences may reuse and overlap the same semantically neutral STM nodes.
  - The Sequence remains active in STM until the completed Logical Episode has been successfully committed to LTM-2.
    After a successful commit, the beginning of the circular input buffer advances to the next Sequence, making
    the committed Sequence no longer part of STM.
  type: list
- title: STM–LTM-1 projection
  text: Every STM node has one permanent physical projection to an input point of LTM-1. This projection is a physical
    connection, not an address, pointer, identifier lookup, or table-based binding.
  type: principle
- text: STM node excitation → fixed physical projection → LTM-1 input excitation → massively parallel propagation
    and semantic stabilization
  type: formula
- title: Transient semantic association
  text: During one excitation, each active STM node is associated with semantic content only through the response
    that its fixed LTM projection participates in producing. The STM node itself does not become a chair, person,
    action, or other Item and retains no permanent semantic attribute after the excitation ends.
  type: paragraph
- title: Parallel interpretation
  text: A request normally excites a distributed set of STM nodes, not one node. Their fixed projections excite
    many LTM-1 inputs in parallel. Semantic interpretation arises from the joint LTM response to the complete active
    STM graph, while each active STM node remains physically coupled to one LTM input for that excitation.
  type: principle
- title: Transformer boundary
  text: The Transformer must receive a semantically interpretable representation equivalent in content to an expression
    such as “Vasya sat on a chair,” not an uninterpreted sequence of neutral node symbols. The exact projection
    from the stabilized LTM-1 response to the canonical Memory Vector or another Transformer-consumable representation
    remains an implementation and research question.
  type: warning
- title: READ interpretation
  text: READ through LTM-1 is not an address lookup. It is parallel excitation from the active STM graph through
    fixed physical projections into LTM-1, followed by propagation, competition, and stabilization into a semantic
    representation suitable for the Transformer. READ remains non-mutating.
  type: principle
- title: Single physical LTM
  text: The architecture contains one physical LTM node and connection array. Semantic element processing and completed-episode
    processing use different message types and orthogonal message-specific state subspaces within that same LTM.
  type: principle
- title: Open questions
  items:
  - What node and connection variables implement the transient linear Sequence without changing physical STM topology?
  - How does the Sequencer estimate Logical Episode boundary confidence?
  - What exact encodings define MSG1 and MSG2 while preserving orthogonality?
  - How are concurrent associative waves scheduled and measured in hardware?
  type: list
