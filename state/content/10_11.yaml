kind: T_Content
section: S_10_11
blocks:
- type: warning
  title: Epistemic status
  text: Working Stage-1 architectural hypothesis. Later evidence may revise it only through an explicit release-level
    architectural change.
- type: principle
  title: Single physical LTM with two logical domains
  text: LTM1 and LTM2 may share one physical vertex and connection substrate while remaining distinct logical domains
    with different update rules.
- type: definition
  title: LTM1
  text: The conservative semantic-associative domain containing stable atoms, contexts, and persistent links in
    the shared internal language.
- type: definition
  title: LTM2
  text: The episodic and compositional domain storing Dialogue history, completed episodes, scenarios, and state
    transitions.
- type: principle
  title: Semantically neutral STM
  text: STM orders and transports internal-language states and maintains active Dialogue Context. It does not define
    a second semantic vocabulary.
- type: definition
  title: Sequence
  text: An ordered activation chain in STM preserving the internal-language order of the current processing step
    or completed episode.
- type: principle
  title: Transformer boundary
  text: Raw external input is interpreted by Transformer before memory access. Memory receives and returns only
    shared internal-language representations.
- type: principle
  title: Dialogue-aware READ
  text: The first exchange of a new Dialogue has no READ. In later exchanges, STM emits MSG2 READ from the current
    internal-language quasi-query; LTM1 activation and linked LTM2 content are selected and serialized into a bounded
    memory message.
- type: formula
  text: Dialogue Context + Current Internal State -> MSG2 READ -> LTM1 Activation -> LTM2 Projection -> Serialized
    Memory Message
- type: principle
  title: Transformer internal-language UPDATE
  text: During processing, Transformer produces a new internal state. STM emits MSG2 UPDATE; receiving LTM1 nodes
    interpret UPDATE locally, and confirmed matches may extend Dialogue Context and LTM2.
- type: definition
  title: MSG2 payload
  text: MSG2(amplitude, sequence_number, operation). operation is interpreted locally by the receiving LTM1 node
    and initially supports READ and UPDATE.
- type: principle
  title: Persistent-graph invariant
  text: READ and UPDATE propagate only through the persistent LTM1 associative graph. Waking operation does not
    structurally modify LTM1.
- type: principle
  title: Match-gated LTM2 write
  text: UPDATE requests associative matching; it does not directly authorize an LTM2 write. Only confirmed matches
    participate in the stored composition.
- type: list
  title: Open questions
  items:
  - How should concurrent associative waves be scheduled?
  - How should serialization preserve relations under a strict sequence budget?
  - How should unresolved internal-language states be retained for sleep-time learning?
