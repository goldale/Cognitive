blocks:
- text: Many improvements in current systems are obtained by increasing model scale or adding specialized components. This project instead examines whether a different organization of existing components can create a larger gain than making any one component more complex.
  type: paragraph
- title: Overall Cognitive Architecture
  description: The end-to-end relationship between input streams, semantic processing, evaluation, planning, memory, reasoning, action, and feedback.
