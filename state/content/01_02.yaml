- text: The strategy is evolutionary. Each stage must be fully operational, independently useful, measurable, and capable of supplying evidence for the next stage. Tighter integration is deferred until the modular implementation has generated enough operational data to justify it.
  type: paragraph
- proportionality_priority: true
  readability_priority: true
  size: standard
  text: 'Existing Components ↓

    Improved Organization ↓

    Operational Evidence ↓

    Deeper Integration'
  type: diagram
- title: No speculative dependency
  text: A proposed mechanism belongs in the engineering roadmap only when it can be implemented with current technology, requires an identifiable extension of current technology, or can be experimentally tested in the foreseeable future.
  type: principle
