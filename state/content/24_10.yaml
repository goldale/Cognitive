kind: T_ContentBlock
id: S_24_10
blocks:
- title: Prototype purpose
  text: The proposed mechanism can be prototyped on conventional CPU, GPU, RAM, and SSD hardware. It does not require
    neuromorphic hardware and does not claim to reproduce the biological implementation.
  type: paragraph
- title: Three implementation structures
  items:
  - Vector similarity search, such as FAISS, Qdrant, or HNSW, provides associative entry into any sufficiently matching
    Event State S_mid.
  - A bidirectional persistent transition store, held in RAM and a store such as RocksDB or LMDB, supports navigation
    toward earlier and later states.
  - A prototype may estimate context change as evidence supplied to D-Context episode and boundary functions.
  type: list
- text: Associative Cue ↓ Vector Similarity Search ↓ Event State S_mid ↓ Backward Traversal ↓ D-Context Episode Start
    Hypothesis ↓ Forward Replay ↓ Reconstructed Episode
  type: formula
- title: Arbitrary entry point
  text: Associative READ need not retrieve an episode identifier or its beginning. It may retrieve any characteristic
    state within the trajectory. The system then traverses backward transitions until a context boundary is inferred
    and performs a separate forward replay from the inferred start.
  type: principle
- type: warning
  title: ARCHITECTURAL DECISION REQUIRED
  text: Define how a prototype recognizes changes relevant to D-Context lifecycle without introducing a new canonical
    architectural component.
- title: Candidate validation
  text: Backward reconstruction should be treated as a hypothesis. Forward replay from the inferred start should
    pass through, or closely reconstruct, the originally retrieved S_mid. Failure to do so lowers confidence in
    the selected trajectory.
  type: principle
- title: Architectural boundaries
  items:
  - Vector search is an implementation component of READ, not Associative Memory itself.
  - The transition structure is an implementation mechanism for chronological navigation, not a Knowledge Graph
    or GraphRAG definition of memory.
  - Candidate context-change evidence does not replace D-Context ownership of episode and boundary semantics.
  type: list
- title: Prototype questions
  items:
  - How should backward and forward transition strengths be learned?
  - How should competing predecessors and successors be resolved without mixing episodes?
  - Which context representation should be used to recognize candidate episode transitions?
  - How should uncertainty and multiple plausible reconstructions be retained?
  - Can forward replay reliably validate a backward-reconstructed start?
  type: list
