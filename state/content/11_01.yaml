blocks:
- text: The raw state produced by Associative Memory should be projected and canonicalized before entering the Transformer. The resulting Memory Vector is the complete public interface of the memory subsystem.
  type: paragraph
- title: Canonical Memory Interface
  description: Canonicalization separates the evolving internal Memory State from the stable interface consumed by the Transformer.
  direction: LR
  edges:
  - flow: information
    from: state
    to: projection
  - flow: information
    from: projection
    to: raw
  - flow: information
    from: raw
    to: canonical
  - flow: information
    from: canonical
    to: vector
  - flow: interface
    from: vector
    label: stable contract
    to: transformer
  nodes:
  - kind: subsystem
    id: canonical
    status: current
    label: Runtime Canonicalization
  - kind: subsystem
    id: projection
    status: current
    label: Projection
  - kind: data
    id: raw
    status: current
    label: Raw Memory Vector
  - kind: state
    id: state
    status: current
    label: Memory State
  - kind: subsystem
    id: transformer
    status: current
    label: Transformer
  - kind: interface
    id: vector
    status: current
    label: Canonical Memory Vector
  proportionality_priority: true
  readability_priority: true
  size: standard
  type: diagram
- text: Canonicalization protects the Transformer from internal memory drift and allows both subsystems to evolve independently.
  type: paragraph
