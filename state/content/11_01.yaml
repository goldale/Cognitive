kind: T_Content
section: S_11_01
blocks:
- type: paragraph
  text: A Dialogue is a logically connected external exchange whose D-Context is created by the first UPDATE. The
    Transformer first converts the external input into a message in its internal language. Memory never receives raw
    external data.
- type: list
  items:
  - Transformer processes the first external message without memory READ.
  - UPDATE transfers the resulting internal state into STM.
  - The first UPDATE creates D-Context in STM within Associative Memory. Subsequent UPDATE operations update this
    D-Context, and corresponding READ operations reuse it.
  - D-Context provides the context in which Associative Memory creates its messages for the Transformer, allowing the
    Transformer to follow the topic of the conversation with the external interlocutor without having to reread the
    entire conversation from the beginning with every new exchange.
- type: heading
  level: 3
  text: Continuing Dialogue cycle
- type: list
  items:
  - Transformer converts the next external message into an internal-language representation.
  - STM emits READ through MSG2 to LTM1.
  - LTM1 activation and LTM2 retrieval select relevant previous Dialogue content and long-term projections.
  - Memory serializes the selected information in the internal language.
  - Transformer continues processing with the Serialized Memory Message.
  - UPDATE stores the resulting new internal state and extends D-Context.
- type: diagram
  title: Dialogue-Aware READ / UPDATE Cycle
  description: The first exchange initializes context. Subsequent exchanges combine previous dialogue content with
    its long-term-memory projection.
  direction: TB
