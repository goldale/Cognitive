blocks:
- text: The raw state produced by Associative Memory should be projected and canonicalized before entering the Transformer.
    The resulting Memory Vector is the complete public interface of the memory subsystem.
  type: paragraph
- type: diagram
  title: Canonical Memory Interface
  description: Canonicalization separates the evolving internal Memory State from the stable interface consumed
    by the Transformer.
  direction: LR
  nodes:
  - id: state
    label: Memory State
    kind: state
    status: current
  - id: projection
    label: Projection
    kind: subsystem
    status: current
  - id: raw
    label: Raw Memory Vector
    kind: data
    status: current
  - id: canonical
    label: Runtime Canonicalization
    kind: subsystem
    status: current
  - id: vector
    label: Canonical Memory Vector
    kind: interface
    status: current
  - id: transformer
    label: Transformer
    kind: subsystem
    status: current
  edges:
  - from: state
    to: projection
    flow: information
  - from: projection
    to: raw
    flow: information
  - from: raw
    to: canonical
    flow: information
  - from: canonical
    to: vector
    flow: information
  - from: vector
    to: transformer
    flow: interface
    label: stable contract
  size: standard
  readability_priority: true
  proportionality_priority: true
- text: Canonicalization protects the Transformer from internal memory drift and allows both subsystems to evolve
    independently.
  type: paragraph
