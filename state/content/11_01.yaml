kind: T_Content
section: S_11_01
blocks:
- type: paragraph
  text: Associative Memory does not generate a separate semantic representation. In response to READ, it selects
    relevant information already represented in the internal language and serializes that information for
    Transformer processing.
- type: principle
  title: Single-language contract
  text: The semantic space used for READ input, UPDATE input, D-Context, and memory output is the same Transformer-derived
    internal language.
- type: definition
  title: Serialized Memory Message
  text: A bounded ordered sequence in the internal language containing prior Dialogue content and its relevant
    projection onto LTM1 and LTM2.
- type: formula
  text: Serialized Memory Message = D-Context + Relevant Long-Term Projection
- type: diagram
  title: Relevant Memory Selection and Serialization
  description: Dialogue context and long-term memory are selected, serialized in the internal language, and
    reinjected into deeper Transformer layers.
  direction: LR
  size: standard
  readability_priority: true
  proportionality_priority: true
