- type: principle
  title: One language, two directions
  text: Transformer-to-memory and memory-to-Transformer communication use the same internal language. READ differs
    from UPDATE by operation and cognitive role, not by semantic representation space. For the Transformer, this
    language is native and requires no additional translation or adaptation steps. Associative Memory, however,
    requires a complex initialization mechanism in which it learns a vocabulary of internal terms and their semantics.
    The detailed initialization algorithm is currently preserved in the research source files
    Dynamic_Associative_Memory_Transformer_EN.tex and Dynamic_Associative_Memory_Transformer_RU.tex, which retain
    research information and provide source material for articles published elsewhere. The relevant description
    will later be incorporated into the primary Cognitive documentation.
- type: note
  title: LTM1 / Vocabulary Structural Stability
  text: Once the LTM1 vocabulary has been initialized, its learned internal terms, semantic mappings, atoms, contexts,
    and persistent associative structure remain structurally stable during waking operation. READ and UPDATE may
    modify activation and LTM2 content, but structural changes to conservative LTM1 occur only during Sleep or Offline
    Consolidation.
