blocks:
- text: Semantic representation answers what an entity or event is, but it does not by itself specify when it occurs. Cognitive state therefore requires explicit temporal attributes such as start time, end time, duration, order, recurrence, deadline, and uncertainty.
  type: paragraph
- text: Actions, observations, memories, plans, and predicted states should carry temporal attributes whenever timing affects interpretation or choice.
  type: paragraph
section_id: S_15_01
