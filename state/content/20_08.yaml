kind: T_ContentBlock
schema_version: 0.3.20
blocks:
- type: definition
  title: Connection State Vector
  text: A persistent state vector attached to each associative connection. It accumulates
    local evidence about how the connection is used, including activation frequency,
    recency, co-activation context, semantic utility, confidence, conflict, and contribution
    to successful reconstruction.
- type: paragraph
  text: Ordinary online operation updates connection-state statistics without immediately
    changing memory topology. This separates inexpensive functional learning from
    expensive structural learning.
- type: diagram
  title: Connection-State Evidence and Sleep-Time Structural Learning
  description: Online activity accumulates local statistics in each associative connection.
    Offline Consolidation and Sleep later use that evidence to modify topology, connection
    strength, routing, merging, creation, or removal.
  direction: TB
  size: standard
  nodes:
  - id: read
    label: Online READ / UPDATE Activity
    kind: process
  - id: connection
    label: Associative Connection
    kind: state
  - id: csv
    label: 'Connection State Vector

      usage · recency · utility · confidence · conflict'
    kind: state
  - id: sleep
    label: Offline Consolidation / Sleep
    kind: subsystem
    status: future
  - id: modify
    label: 'Structural Modification

      strengthen · weaken · create · merge · remove'
    kind: process
    status: future
  edges:
  - from: read
    to: connection
    label: uses association
    flow: learning
  - from: connection
    to: csv
    label: accumulates local statistics
    flow: learning
  - from: csv
    to: sleep
    label: evidence for offline analysis
    flow: optimization
  - from: sleep
    to: modify
    label: selects structural changes
    flow: optimization
  - from: modify
    to: connection
    label: updates topology and parameters
    flow: optimization
  readability_priority: true
  proportionality_priority: true
- type: note
  title: Neuromodulator analogy
  text: 'The Connection State Vector is architecturally analogous to locally accumulated
    biochemical modulation around biological synapses: repeated use, salience, reward,
    stress, novelty, and other context-dependent signals can leave traces that later
    influence plasticity. This is an engineering analogy, not a claim that the vector
    literally reproduces any specific neurotransmitter or neuromodulator mechanism.'
- type: list
  items:
  - 'Online phase: accumulate statistics and permit small reversible parameter updates.'
  - 'Sleep phase: compare evidence across many connections and episodes.'
  - 'Structural phase: strengthen, weaken, create, merge, reroute, or remove connections.'
  - Preserve provenance, rollback information, and uncertainty for every destructive
    change.
- type: principle
  title: Functional and structural learning remain separate
  text: Connection State Vectors collect evidence during normal operation. They do
    not authorize immediate topology changes. Expensive structural modification is
    performed only by an explicit Offline Consolidation / Sleep subsystem under validation
    and rollback controls.
