kind: T_ContentBlock
schema_version: 0.3.30
blocks:
- text: 'The processing sequence is: physical and perceptual preprocessing, semantic representation, Task Relevance
    evaluation, Semantic Novelty evaluation, and a Memory Update decision.'
  type: paragraph
- type: diagram
  title: Hierarchical Cognitive Filtering
  description: Information is progressively filtered by meaning, current relevance, and novelty before memory is
    changed.
  direction: TB
  nodes:
  - id: stream
    label: Input Stream
    kind: external
    status: current
  - id: extract
    label: Semantic Extraction
    kind: subsystem
    status: current
  - id: relevance
    label: Task Relevance Evaluation
    kind: subsystem
    status: current
  - id: novelty
    label: Semantic Novelty Evaluation
    kind: subsystem
    status: current
  - id: decision
    label: Memory Update Decision
    kind: subsystem
    status: current
  - id: memory
    label: Memory State
    kind: state
    status: current
  edges:
  - from: stream
    to: extract
    flow: information
  - from: extract
    to: relevance
    flow: information
  - from: relevance
    to: novelty
    flow: information
  - from: novelty
    to: decision
    flow: information
  - from: decision
    to: memory
    flow: learning
    label: accepted update
  - from: memory
    to: novelty
    flow: feedback
    label: current knowledge
  size: standard
  readability_priority: true
  proportionality_priority: true
- text: 'Each stage answers a different question: what is present, what matters now, what is new, and whether persistent
    state should change.'
  type: paragraph
section_id: S_18_04
id: S_05_04
