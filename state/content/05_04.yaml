- text: 'The processing sequence is: physical and perceptual preprocessing, semantic representation, Task Relevance evaluation, Semantic Novelty evaluation, and a Memory Update decision.'
  type: paragraph
- title: Hierarchical Cognitive Filtering
  description: Information is progressively filtered by meaning, current relevance, and novelty before memory is changed.
  direction: TB
  edges:
  - flow: information
    from: stream
    to: extract
  - flow: information
    from: extract
    to: relevance
  - flow: information
    from: relevance
    to: novelty
  - flow: information
    from: novelty
    to: decision
  - flow: learning
    from: decision
    label: accepted update
    to: memory
  - flow: feedback
    from: memory
    label: current knowledge
    to: novelty
  nodes:
  - kind: subsystem
    id: decision
    status: current
    label: Memory Update Decision
  - kind: subsystem
    id: extract
