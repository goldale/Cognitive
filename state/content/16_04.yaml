- text: Direct internal-state Merge between mature lineages is expected to be destructive or undefined.
    Exchange should use dialogue, externalized Research State, experiments, books, and training trajectories.
  type: paragraph
- text: This protects identity and diversity while permitting useful discoveries to propagate.
  type: paragraph
- text: A receiving lineage integrates exported knowledge according to its own objectives. It need not
    reproduce the source representation or conclusions exactly.
  type: paragraph
