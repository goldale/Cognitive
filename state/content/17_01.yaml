blocks:
- title: T_ResearchState
  text: The canonical implementation-independent state of the research model from which human-readable and machine-readable
    artifacts are generated.
  type: definition
- text: Research State stores the current consolidated model, not the full dialogue transcript. It includes Tokens,
    principles, hypotheses, architecture decisions, open questions, roadmap items, chapter structure, and the latest
    consolidation record.
  type: paragraph
- text: The state must support recovery after session loss, use by a different model, and long-term local ownership.
  type: paragraph
- text: Documentation is a partial serialization of Research State for a human audience. English and future language
    versions are separate serializations, not an original plus literal translations.
  type: paragraph
section_id: S_11_01
