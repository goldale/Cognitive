kind: T_Content
section: S_03_03
blocks:
- type: paragraph
  text: The same internal language is used in both directions. Transformer sends READ and UPDATE content through
    STM; memory returns serialized relevant information to Transformer without semantic translation.
- type: table
  headers:
  - Subsystem
  - Role in the shared language
  rows:
  - - Transformer
    - Creates and interprets internal-language states.
  - - STM
    - Orders, transports, and maintains active Dialogue context without defining semantics.
  - - LTM1
    - Organizes stable internal-language atoms, contexts, and associative transitions.
  - - LTM2
    - Stores compositions, episodes, scenarios, and Dialogue history in the same language.
- type: principle
  title: No raw external input to memory
  text: Raw text, pixels, audio, video, packets, or other external observations never enter LTM1 or LTM2 as semantic
    input. Transformer interprets them first.
- type: principle
  title: READ and UPDATE share one semantic space
  text: READ and UPDATE differ by operation and cognitive role, not by representation language.
- type: formula
  text: Language(READ input) = Language(UPDATE input) = Language(memory serialization)
- type: note
  title: RN-0002 — Translation as Cognitive State Reconstruction
  object_id: RN-0002
  text: Translation is treated as reconstruction of a compatible cognitive state rather than substitution of surface
    symbols. The shared internal language provides the system-level representation in which this compatibility can
    be tested.
