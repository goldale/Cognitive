blocks:
- text: 'Integrated Evaluation participates in a closed loop: representations and candidate plans are evaluated;
    an action is selected; the environment and internal state change; the observed result is represented and evaluated
    again.'
  type: paragraph
- type: diagram
  title: Evaluation Feedback Loop
  description: The consequences of behavior return as new input and are evaluated again, closing the cognitive control
    loop.
  direction: TB
  nodes:
