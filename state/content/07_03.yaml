blocks:
- text: 'Integrated Evaluation participates in a closed loop: representations and candidate plans are evaluated; an action is selected; the environment and internal state change; the observed result is represented and evaluated again.'
  type: paragraph
- title: Evaluation Feedback Loop
  description: The consequences of behavior return as new input and are evaluated again, closing the cognitive control loop.
  direction: TB
  edges:
  - flow: information
    from: representation
    to: evaluation
  - flow: evaluation
    from: evaluation
    label: selection
    to: behavior
  - flow: control
    from: behavior
    label: action
    to: world
  - flow: information
    from: world
    to: consequence
  - flow: learning
    from: consequence
    label: learning signal
    to: memory
  - flow: feedback
    from: memory
    label: updated context
    to: representation
  nodes:
  - kind: external
    id: behavior
    status: current
    label: 'Selected

      Behavior'
  - kind: data
