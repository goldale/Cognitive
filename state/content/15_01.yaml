blocks:
- text: Written text, speech, lectures, and dialogue all provide linguistic information. Their channel properties differ, but each can trigger T_Deserialization and T_ModelIntegration.
  type: paragraph
- text: Speech adds timing, emphasis, and emotional coloration. Written text permits arbitrary pacing, exact revisitation, annotation, and repeated integration attempts.
  type: paragraph
- text: A lecture combines prepared serialization with real-time adaptation to questions. Dialogue adds an iterative feedback loop in which the sender can change later serialization based on observed integration failure.
  type: paragraph
section_id: S_08_01
