blocks:
- type: definition
  title: Canonical vertex model
  text: A vertex is an identifier of a concept in the associative dictionary and a point of long-term statistical
    observation of its use.
- type: diagram
  title: Vertex-owned persistent state
  description: Each vertex owns the persistent state associated with one associative concept.
  direction: TB
  size: standard
  nodes:
  - id: vertex
