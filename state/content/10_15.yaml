kind: T_ContentBlock
id: S_10_15
section_id: S_10_15
blocks:
- type: warning
  title: Epistemic status
  text: Working architectural hypothesis. It defines an implementable communication contract without claiming that
    the final biological realization is already known.
- type: definition
  title: Native communication language
  text: The native language between memory and Transformer is formed from associative atoms already present in LTM1.
    Transformer does not invent an independent semantic vocabulary.
- type: principle
  title: Export mechanism
  text: A deterministic external controller selectively excites or admits selected LTM1 nodes to repeated Memory
    Vector readout. Each Memory Vector element aggregates its assigned LTM1 contributors by MAX or SUM. Repeated
    measurements expose the required associative atoms as a stream consumable by Transformer.
- type: principle
  title: MAX path
  text: With MAX, repeated selective readout can expose the strongest eligible contributor and then the next eligible
    contributor. This creates a ranked native-language stream without requiring global LTM1 serialization.
- type: principle
  title: SUM path
  text: With SUM, repeated independently controlled projections create a system of linear measurements. If the projection
    system has sufficient rank, the selected contributors can be recovered by an external decoder. The decoder,
    not Transformer, performs the inversion.
- type: principle
  title: Purpose of reconstruction
  text: Recovering internal LTM1 node states is a means for constructing an efficient native communication language
    between LTM1, Transformer, and LTM2. It is not itself the persistent object stored in LTM2 and is not a requirement to serialize the complete state of LTM1.
- type: definition
  title: Transformer composition
  text: Transformer receives exported LTM1 atoms and combines them into contextual STM chains. Most semantic relations
    are themselves LTM1 atoms; only a very small structural-link alphabet is expected.
- type: definition
  title: Contextual four-tuple
  text: The working local composition is object, context, previous, next. Context is normally one or two existing
    LTM1 links. Previous and next are represented by the STM chain topology rather than duplicated as semantic fields.
- type: principle
  title: Return path
  text: Transformer places the completed construction directly into STM. STM-node activation emits MSG2(amplitude,
    sequence_number, operation). For UPDATE, the operation is UPDATE; the Sequencer is unnecessary because chain
    boundaries and order are already complete.
- type: principle
  title: Match-gated LTM2 write
  text: UPDATE excitation propagates only through LTM1. A receiving node becomes a candidate, and only a confirmed
    associative match may participate in the LTM2 composition write.
