kind: T_ContentBlock
id: S_08_05
blocks:
- text: 'A persistent Self introduces risks: self-preservation incentives, resistance to correction, manipulation
    of the evaluator, and conflict between system and user objectives.'
  type: paragraph
- text: The first implementation should therefore keep identity continuity, evaluation, and action authority
    separable. The system can model itself and learn consequences without receiving unrestricted autonomous
    control.
  type: paragraph
- text: External checkpoints, transparent Research State, constrained action interfaces, and independent
    evaluation lineages can reduce risk while preserving longitudinal learning.
  type: paragraph
- title: Functional before sovereign
  text: Build a persistent self-model for attribution and learning before granting broad independent power
    to pursue self-generated goals.
  type: principle
section_id: S_07_06
