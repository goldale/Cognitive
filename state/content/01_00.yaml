blocks:
- type: paragraph
  text: Today's large language models are already capable of understanding language, reasoning, planning, and generating
    coherent responses. Their greatest limitation is not their ability to think, but their inability to continuously
    accumulate, organize, and reuse knowledge throughout the lifetime of the system.
- type: paragraph
  text: 'The goal of the Cognitive Architecture is to overcome this limitation while preserving the strengths of
    the Transformer. Rather than replacing the Transformer with an entirely new architecture, the Cognitive Architecture
    starts with an existing, well-established Transformer and extends it with one additional capability: an external
    Associative Memory.'
- type: paragraph
  text: The modification itself is surprisingly small.
- type: paragraph
  text: In the canonical implementation, one internal layer located approximately in the middle of the Transformer
    is expanded by a factor of two.
- type: paragraph
  text: The original neurons continue to perform exactly the same computation as before.
- type: paragraph
  text: At the same time, their internal activation state is made available to the external Associative Memory.
- type: paragraph
  text: The additional neurons create a direct neural interface between the Transformer and an external Associative
    Memory.
- type: paragraph
  text: One half of this interface carries information from the Transformer to the Associative Memory, allowing
    the memory to learn directly from the Transformer's own internal language.
- type: paragraph
  text: The other half carries information from the Associative Memory back to the Transformer, allowing relevant
    long-term knowledge to return encoded in exactly the same internal language.
- type: paragraph
  text: From the Transformer's perspective, interaction with long-term memory becomes part of its normal forward
    computation. No separate reasoning mechanism or external retrieval process is required.
- type: paragraph
  text: The result is a clear separation of responsibilities.
- type: paragraph
  text: The Transformer continues to think. It understands language, performs reasoning, constructs plans, and generates
    responses.
- type: paragraph
  text: The Associative Memory remembers. It preserves the system's Adaptive Long-Term State, accumulates experience,
    stores learned knowledge, and continuously develops new associations over time.
- type: paragraph
  text: Neither subsystem attempts to perform the role of the other.
- type: paragraph
  text: Instead, they operate together as a single cognitive system by communicating through a Shared Internal Language
    that naturally exists inside the Transformer itself.
- type: paragraph
  text: This architectural separation is the foundation of the Cognitive Architecture. Thinking and long-term adaptation
    become independent responsibilities while remaining tightly integrated through a common neural language. Every
    component described in the remainder of this document follows from this single architectural principle.
- type: diagram
  title: Cognitive Architecture
  description: Conceptual overview of the Cognitive Architecture. The Transformer thinks, the Associative Memory
    remembers, and both communicate through a Shared Internal Language.
