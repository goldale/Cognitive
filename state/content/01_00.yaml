id: S_01_00
section_id: S_01_00
blocks:
- type: paragraph
  text: Cognitive is a project to discover a small set of architectural principles from which coherent cognitive
    behavior can emerge. The architecture is developed by reducing unnecessary representational duplication and
    by assigning each subsystem a clear responsibility.
- type: principle
  title: Architectural manifesto
  text: A cognitive architecture should become simpler as it becomes more capable. New mechanisms should strengthen
    the unity of the architecture rather than create additional independent semantic systems.
- type: paragraph
  text: The designed system therefore uses one Transformer-derived Internal Language across Transformer, STM, LTM1,
    and LTM2. Meaning is generated by Transformer computation; memory preserves, retrieves, and serializes information
    expressed in that language.
- type: list
  title: Foundational design principles
  items:
  - The trained Transformer defines the Internal Language used by the cognitive system.
  - All cognitive subsystems communicate in the Internal Language.
  - Memory does not define an independent semantic language.
  - Dialogue is the architectural boundary of a logically connected exchange with the external world.
  - D-Context, stored in STM, defines the subset used by memory retrieval and serialization.
  - Every subsystem should have one clearly defined architectural responsibility.
- type: principle
  title: Design criterion
  text: Any future extension should increase architectural capability without increasing the number of independent
    semantic concepts unless that new concept is indispensable.
