- type: principle
  title: One language, two directions
  text: Transformer-to-memory and memory-to-Transformer communication use the same internal language. READ differs
    from UPDATE by operation and cognitive role, not by semantic representation space.
- type: note
  title: LTM1 structural stability
  text: During waking operation READ and UPDATE may modify activation and LTM2 content, but structural changes to
    conservative LTM1 occur only during Sleep or Offline Consolidation.
