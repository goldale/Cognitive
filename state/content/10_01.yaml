kind: T_Content
section: S_10_01
blocks:
- type: paragraph
  text: Transformer and Associative Memory are separated by responsibility but coupled by a closed semantic learning
    loop. The Transformer does not merely consume memory for reasoning; it teaches Associative Memory by producing
    the semantic objects used for learning.
- type: definition
  title: Semantic Teacher
  text: The Transformer role that converts externally grounded processing and retrieved context into a Semantic
    Representation suitable for Associative Memory UPDATE.
- type: definition
  title: Semantic Feedback Learning Pipeline
  text: A first-class architectural process coordinating explicit READ, semantic reasoning, semantic teaching, UPDATE,
    and the resulting evolution of Memory State.
- type: diagram
  title: Closed Semantic Learning Loop
  description: External Input is interpreted with an explicitly retrieved Memory Vector. Transformer output becomes
    a Semantic Representation. UPDATE changes Memory State only; a later READ is required to obtain another Memory
    Vector.
