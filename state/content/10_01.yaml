blocks:
- text: The near-term architecture separates a Transformer from Associative Memory. The Transformer performs language
    processing, general inference, planning, and response generation. Associative Memory stores accumulated experience,
    supports associative retrieval, and evolves independently. The generated answer must return to Associative Memory
    as an internal observation, creating a back link that keeps the cognitive cycle continuous rather than terminating
    at output generation. This feedback path modifies Associative Memory only; it does not perform a READ operation
    and therefore does not generate a new Memory Vector.
  type: paragraph
- type: diagram
  title: Associative Memory Read Path
  description: An external utterance initiates an explicit READ operation that produces a Memory Vector for the
    Transformer. The generated answer returns as an internal observation and changes Associative Memory, but the
    feedback path does not produce another Memory Vector.
