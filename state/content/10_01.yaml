kind: T_Content
section: S_10_01
blocks:
- type: paragraph
  text: Biological memory does not behave as a precise archive. Recall is selective, reconstructive, context-dependent,
    and vulnerable to systematic distortion. Cognitive therefore treats memory as an active model supporting present
    processing rather than as a passive record store.
- type: diagram
  title: Memory Architecture in the Internal Language
  description: A continuing Dialogue activates LTM1 and linked LTM2 content. Memory selects relevant state and serializes
    it in the same internal language used by Transformer.
  direction: TB
  size: standard
  readability_priority: true
  proportionality_priority: true
