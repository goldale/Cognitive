kind: T_Content
section: S_10_01
blocks:
- type: paragraph
  text: READ and UPDATE are phases of one Dialogue-aware cognitive cycle. Transformer first converts external input
    into the shared internal language. Memory never receives raw external data.
- type: definition
  title: Dialogue
  text: A logically connected external exchange whose context is established by UPDATE and reused by later READ
    operations.
- type: heading
  level: 3
  text: First exchange of a Dialogue
- type: list
  items:
  - Transformer processes the opening external message without memory READ.
  - Transformer produces a response or intermediate result.
  - UPDATE transfers the resulting internal state through STM.
  - Memory creates the initial Dialogue Context and may store the first Dialogue episode in LTM2.
- type: heading
  level: 3
  text: Continuing Dialogue cycle
- type: list
  items:
  - Transformer converts the next external message into an internal-language representation.
  - STM emits READ through MSG2 to LTM1.
  - LTM1 activation and LTM2 retrieval select relevant previous Dialogue content and long-term projections.
  - Memory serializes the selected information in the shared internal language.
  - Transformer continues processing with the Serialized Memory Message.
  - UPDATE stores the resulting new internal state and extends Dialogue Context.
- type: diagram
  title: Dialogue-Aware READ / UPDATE Cycle
  description: The first exchange initializes context. Subsequent exchanges combine previous dialogue content with
    its long-term-memory projection.
  direction: TB
  size: standard
  readability_priority: true
  proportionality_priority: true
