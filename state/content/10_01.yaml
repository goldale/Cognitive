- type: principle
  title: Shared-language invariant
  text: Memory output is not translated into a separate representation. It is serialized in the same Transformer-derived
    internal language used for READ and UPDATE.
- type: hypothesis
  title: Functional lossiness
  confidence: 0.78
  text: Memory loss and reconstruction are partly selected because they improve integration and future action, not
    only because biological storage is limited.
- type: paragraph
  text: The relevant objective is not exhaustive historical fidelity. It is useful continuity, prediction, and action
    under resource constraints.
