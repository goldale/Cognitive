- type: heading
  level: 3
  text: READ contract
- type: formula
  text: READ(Memory State, Query) -> Memory Vector
- type: paragraph
  text: READ is a retrieval operation. It may expose context to the Transformer but never modifies Memory State.
- type: heading
  level: 3
  text: UPDATE contract
- type: formula
  text: UPDATE(Memory State, Semantic Representation) -> Updated Memory State
- type: paragraph
  text: UPDATE is a learning operation. Its only architectural effect is modification of Memory State. It does not
    generate a new Memory Vector and performs no implicit retrieval. A Memory Vector is generated exclusively by
    a subsequent explicit READ operation.
- type: principle
  title: Why semantic feedback is necessary
  text: Raw external observations are not stable learning targets. Transformer-produced Semantic Representations
    provide interpretation, normalization, context, and abstraction before information is incorporated into Associative
    Memory.
- type: heading
  level: 3
  text: Lifecycle and extension boundary
- type: list
  items:
  - Explicit READ retrieves a Memory Vector from the current Memory State.
  - Transformer performs semantic reasoning using external input and retrieved context.
  - Transformer acts as Semantic Teacher and produces a Semantic Representation.
  - The Semantic Feedback Learning Pipeline submits that representation to UPDATE.
  - UPDATE modifies Memory State only.
  - Any effect of learning on retrieval is observed only by a later explicit READ.
- type: note
  title: Deferred extensions
  text: Sleep, replay, forgetting, importance estimation, structural plasticity, and global evaluation may extend
    the pipeline later, but they must preserve the READ/UPDATE asymmetry unless a future architecture decision explicitly
    replaces it.
