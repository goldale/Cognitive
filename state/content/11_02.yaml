- text: As an initial approximation, the raw vector is L2-normalized. Direction represents which knowledge is activated, while the original magnitude is retained separately as activation strength.
  type: paragraph
- text: This separation avoids forcing two different quantities into one unstable signal and provides the Transformer with a more predictable input distribution.
  type: paragraph
