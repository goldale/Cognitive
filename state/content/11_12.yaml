blocks:
- type: paragraph
  text: External multimodal observations enter the active processing path as Transformer-compatible activations.
    This section intentionally does not define an additional persistent architectural component between the external
    source and the active internal state.
- type: warning
  title: ARCHITECTURAL DECISION REQUIRED
  text: Define how incoming observations are retained and ordered before or during integration into the active internal
    state, including the lifetime of unconsumed observations and the behavior when multiple external streams progress
    concurrently.
