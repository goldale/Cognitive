blocks:
- type: definition
  title: Input Buffer
  text: A modality-neutral temporary stream of input activations before they enter active Transformer/STM processing.
    It is not semantic memory and performs no associative lookup.
- type: principle
  title: No separate sequencing component
  text: Input order is preserved by the producing stream and the receiving activation path. The architecture introduces
- type: diagram
  description: External streams enter the Input Buffer and continue directly into the active processing state. No
    intermediate sequencing module exists.
  direction: LR
  size: standard
  readability_priority: true
  proportionality_priority: true
  nodes:
  - id: language
    label: Language / Messages
    kind: external
  - id: stream
    label: Other Stream Input
    kind: external
  - id: buffer
    label: Input Buffer
    kind: state
  - id: stm
