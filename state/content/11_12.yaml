    flow: information
  - from: stm
    to: core
    flow: information
- type: warning
  title: Boundary inference is cognitive processing
  text: When an episode or segment boundary must be inferred rather than supplied by the source, that inference
    belongs to Transformer cognitive processing. It does not justify a separate architectural component.
