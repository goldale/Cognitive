[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-systems-lab"
version = "0.1.0"
description = "Research State tooling and executable prototypes for long-lived cognitive systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cogstate = "cogsys.cli:main"
cogsys-demo = "cogsys.runtime.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
